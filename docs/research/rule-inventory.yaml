      A substring match on the algorithm literal. `crypto.createCipher` (no `iv`) belongs in this
      rule too — it is deprecated precisely because its key derivation is MD5-based and its IV is
      implicit.

  - id: no-hardcoded-crypto-key
    family: cryptography
