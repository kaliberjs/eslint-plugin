      DOM source reaches them.

  - id: no-postmessage-without-origin-check
    family: browser-dom
    title: Verify event.origin in message event handlers
    description: >
      A `message` handler receives events from any window that has a reference to yours. Without
      an `event.origin` check the handler is an unauthenticated, cross-origin RPC endpoint.
    owasp_top10_2021: A08:2021-Software and Data Integrity Failures
    owasp_api_top10_2023: none
    cwe: [CWE-346]
    cwe_parents: [CWE-345, CWE-284, CWE-693]
    capec: [CAPEC-111, CAPEC-21]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "addEventListener('message', handler) where handler never reads event.origin"
      - "window.onmessage = handler with the same"
      - "an origin check that uses includes/indexOf instead of equality"
      - "worker/iframe message handlers acting on event.data without validation"
    sanitizers:
      - "an early return unless event.origin equals an expected literal or is in a literal allowlist"
      - "MessageChannel with a transferred port, which is origin-scoped by construction"
    known_false_positives:
      - Handlers that only act on a same-origin protocol tag and do nothing sensitive
      - Dev-tooling handlers (HMR, Storybook, React DevTools bridges)
      - Origin checked in a shared helper called from the handler
      - Handlers filtering on `event.source === expectedWindow`, which is a valid alternative check
    known_false_negatives:
      - Origin compared with a permissive substring match
      - Handler defined in one module and registered in another
      - Origin check present but the data still used before it
    prior_art:
      - "CodeQL js/missing-origin-check"
      - "CodeQL js/cross-window-information-leak"
      - "SonarJS S2819 — 'Origins should be verified during cross-origin communications' (CWE-345)"
      - "Semgrep javascript/browser/security/insufficient-postmessage-origin-validation.yaml (id: insufficient-postmessage-origin-validation)"
    references:
      - https://cwe.mitre.org/data/definitions/346.html
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-missing-origin-check/
    notes: >
      A positive-obligation rule with a clean signature: within the handler function body, is
      `event.origin` (or `event.source`) read at all. Accepting `event.source` comparison as valid
      is important — it is a legitimate pattern and rejecting it would produce confident false
      positives.

  - id: no-wildcard-postmessage-target
    family: browser-dom
    title: Do not use "*" as the postMessage target origin
    description: >
      `targetWindow.postMessage(data, '*')` delivers the message to whatever document currently
      occupies that window. If the target navigated, the data — often a token — goes to the
      attacker.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: none
    cwe: [CWE-346]
    cwe_parents: [CWE-345, CWE-284, CWE-693]
    capec: [CAPEC-111]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "postMessage(data, '*')"
      - "iframe.contentWindow.postMessage(data, '*')"
      - "window.parent.postMessage(data, '*')"
      - "window.opener.postMessage(data, '*')"
    sanitizers:
      - "an explicit target origin literal or a value derived from a trusted allowlist"
    known_false_positives:
      - Broadcasting genuinely non-sensitive data (a resize notification) where `*` is acceptable
      - Communication with a sandboxed iframe whose origin is `null`, where `*` is the only option
      - Dev tooling
    known_false_negatives:
      - Target origin from a variable that is `'*'` at runtime
      - postMessage inside a dependency (embed SDKs commonly use `*`)
    prior_art:
      - "CodeQL js/cross-window-information-leak"
      - "SonarJS S2819 — 'Origins should be verified during cross-origin communications' (CWE-345)"
      - "Semgrep javascript/browser/security/wildcard-postmessage-configuration.yaml (id: wildcard-postmessage-configuration)"
    references:
      - https://cwe.mitre.org/data/definitions/346.html
      - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    notes: >
      Trivial to implement (a string literal in argument position 2) and the sandboxed-iframe
