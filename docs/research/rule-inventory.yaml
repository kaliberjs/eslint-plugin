    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "crypto.createHash('md5') / createHmac('md5', ...)"
      - "crypto-js: CryptoJS.MD5"
      - "md5 / md5-hex / blueimp-md5 package calls"
      - "webpack/vite `hashFunction: 'md5'` in security-relevant contexts"
    sanitizers:
      - "SHA-256/SHA-512 for integrity, bcrypt/argon2 for passwords, HMAC-SHA256 for authentication"
    known_false_positives:
      - Non-security hashing — cache keys, ETags, content-addressed build artifacts, Gravatar URLs, test fixtures
      - Interoperating with an external system that mandates MD5
      - Reproducing a legacy digest during a migration
    known_false_negatives:
      - Algorithm name from a variable or config
      - MD5 inside a dependency
    prior_art:
      - "CodeQL js/weak-cryptographic-algorithm"
      - "SonarJS S4790 — 'Weak hashing algorithms should not be used' (CWE-1240)"
