      - https://nodejs.org/api/crypto.html
      - https://codeql.github.com/codeql-query-help/javascript/js-insecure-randomness/
    notes: >
      Deliberately scored with confidence 2 and false_positive_risk 5, which is a disagreement
      with the brief's proposed first ten. `Math.random()` appears in almost every codebase and is
