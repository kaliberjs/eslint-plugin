    notes: >
      `detect-possible-timing-attacks` is one of the more widely disabled rules in
      eslint-plugin-security, and its false-positive profile is the reason. Real but low-impact
      in most web contexts, and the name-based heuristic is weak. Keep as opt-in at most.

