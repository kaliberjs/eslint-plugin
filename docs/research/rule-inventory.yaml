      - "Semgrep javascript/express/security/audit/express-session-hardcoded-secret.yaml (id: express-session-hardcoded-secret)"
      - "Semgrep javascript/lang/security/audit/hardcoded-hmac-key.yaml (id: hardcoded-hmac-key)"
    references:
      - https://cwe.mitre.org/data/definitions/259.html
      - https://cwe.mitre.org/data/definitions/798.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
      - https://capec.mitre.org/data/definitions/70.html
    notes: >
      Positional detection (which parameter/property is this literal in) is the whole trick, and
      it is why this scores far better than generic entropy scanning. Deliberately split from
      no-hardcoded-api-key: this one is precise because the sink names the credential; that one is
      a heuristic on the literal itself. Ship this, defer that.

  - id: no-hardcoded-api-key
    family: authentication-credentials
    title: Do not embed provider API keys or tokens as string literals
    description: >
      Provider keys with recognisable prefixes and shapes (`sk_live_`, `ghp_`, `AKIA`, `xoxb-`,
      Google `AIza`, Stripe, SendGrid, private-key PEM blocks) are detectable from the literal
      alone, independent of where they are used.
    owasp_top10_2021: A07:2021-Identification and Authentication Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-798]
    cwe_parents: [CWE-1391, CWE-1390, CWE-287, CWE-284]
    capec: [CAPEC-191, CAPEC-70]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "any string literal matching a known provider key pattern"
      - "-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY----- blocks in source"
      - "Authorization: Bearer <literal> header construction"
    sanitizers:
      - environment variables or a secrets client
      - "publishable/anon keys that are designed to be public (Stripe pk_, Supabase anon, Sanity public dataset tokens) — must be an explicit allowlist"
    known_false_positives:
      - Publishable keys that are meant to be in client bundles
      - Revoked or example keys in tests and documentation
      - High-entropy strings that are not keys — hashes, UUIDs, base64 fixtures, minified data, CSS-in-JS class hashes, snapshot files
      - Public keys (as opposed to private keys) in PEM form
    known_false_negatives:
      - Keys without a recognisable prefix (the majority of in-house tokens)
      - Keys split across concatenated literals or assembled at runtime
      - Keys in non-JS files
    prior_art:
      - "SonarJS S6418 — 'Secrets should not be hard-coded' (CWE-798)"
      - "CodeQL js/build-artifact-leak (adjacent: secrets reaching build output)"
      - "CodeQL js/clear-text-storage-of-sensitive-data"
    references:
      - https://cwe.mitre.org/data/definitions/798.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    notes: >
      Honest assessment: generic entropy-based secret detection is the single largest false-positive
      generator in this inventory, and it duplicates tools that do it better with git history and
      provider verification APIs (gitleaks, trufflehog, GitHub secret scanning). If we ship
      anything here it should be *prefix-pattern only*, no entropy heuristic, with an allowlist for
      publishable keys. This is not a first-ten rule despite its impact score.

  - id: no-weak-password-hashing
    family: authentication-credentials
    title: Do not hash passwords with fast general-purpose hashes
    description: >
      MD5, SHA-1, SHA-256 and HMAC variants are designed to be fast, which is exactly wrong for
      password storage. Use bcrypt, scrypt, or Argon2id with a real work factor.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-916]
    cwe_parents: [CWE-328, CWE-327, CWE-326, CWE-693]
    capec: [CAPEC-55]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "crypto.createHash('md5'|'sha1'|'sha256') where the input is a password-named value"
      - "crypto.createHmac(..., password)"
      - "crypto.pbkdf2 / pbkdf2Sync with an iteration count below the OWASP-recommended floor"
      - "bcrypt.hash / hashSync with a cost factor below 10"
      - "argon2.hash with memoryCost/timeCost below the reference configuration"
      - "scrypt with a low N parameter"
    sanitizers:
      - "bcrypt / scrypt / argon2id at recommended parameters (a fix, not a sanitizer)"
    known_false_positives:
      - Hashing a value that is named like a password but is not one (a password *hash* being re-hashed for a lookup key)
      - Legacy-migration code that must reproduce an old hash to verify then upgrade
      - Deriving a cache key or ETag from a value with `password` in the identifier
    known_false_negatives:
      - Password identified by a name the heuristic does not match (`p`, `credential`, `secret`)
      - Custom hashing helper in another module
      - Correct algorithm with parameters loaded from config at runtime
    prior_art:
      - "CodeQL js/insufficient-password-hash"
      - "SonarJS S4790 — 'Weak hashing algorithms should not be used' (CWE-1240)"
      - "SonarJS S5547 — 'Cipher algorithms should be robust' (CWE-327, CWE-326)"
      - "Semgrep javascript/lang/security/audit/md5-used-as-password.yaml (id: md5-used-as-password)"
      - "Semgrep javascript/argon2/security/unsafe-argon2-config.yaml (id: unsafe-argon2-config)"
    references:
      - https://cwe.mitre.org/data/definitions/916.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-insufficient-password-hash/
      - https://capec.mitre.org/data/definitions/55.html
    notes: >
      The identifier heuristic ("is this argument a password") is the only soft part, and it is
      soft in the direction of false negatives rather than false positives, which is the right
      trade. Parameter-floor checks (bcrypt rounds, pbkdf2 iterations, argon2 memory) are pure
      literal comparison and are the cheapest half of the rule. Strong first-wave candidate.

  - id: no-unsalted-password-hash
    family: authentication-credentials
    title: Do not hash passwords without a per-record salt
    description: >
      A one-way hash without a salt is precomputable: identical passwords produce identical
      digests and rainbow tables apply. A constant or global salt is the same weakness.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-759]
    cwe_parents: [CWE-916, CWE-328, CWE-327, CWE-326, CWE-693]
    capec: [CAPEC-55]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 3
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "crypto.createHash(...).update(password).digest() with no salt in the update chain"
      - "crypto.pbkdf2 / scrypt with a literal or module-constant salt (CWE-760 shape)"
    sanitizers:
      - "crypto.randomBytes-derived per-record salt"
      - "bcrypt/argon2, which salt internally"
    known_false_positives:
      - Deliberate deterministic hashing for blind-index lookup (a real pattern, needs an escape hatch)
      - HMAC with a server-side pepper, which is a different and acceptable design
    known_false_negatives:
      - Salt concatenated in a helper function
      - Salt read from config that happens to be constant across records
    prior_art:
      - "CodeQL js/insufficient-password-hash (covers the unsalted case within the same query)"
    references:
      - https://cwe.mitre.org/data/definitions/759.html
      - https://cwe.mitre.org/data/definitions/760.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    notes: >
      Mostly subsumed by no-weak-password-hashing in practice — if you are using bcrypt/argon2 the
      salt question does not arise. Kept as a separate entry because CWE-759/760 are separate
      weaknesses and because the constant-salt-with-pbkdf2 pattern is real and not caught by an
      algorithm-name check.

  - id: no-jwt-alg-none
    family: authentication-credentials
    title: Do not accept or produce JWTs with the "none" algorithm
    description: >
      `alg: none` means unsigned. A verifier that accepts it accepts any token the attacker
      writes, so authentication is trivially bypassed. RFC 8725 requires that verifiers never
      select the algorithm from the token header.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-347]
    cwe_parents: [CWE-345, CWE-693]
    capec: [CAPEC-475, CAPEC-463]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 5
      ecosystem_prevalence: 2
      confidence: 5
      false_positive_risk: 1
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "jsonwebtoken: sign/verify with algorithm(s) including 'none'"
      - "jose: SignJWT with alg 'none', jwtVerify with algorithms containing 'none'"
      - "jwt-simple: encode/decode with 'none'"
      - "any options object literal containing `algorithm: 'none'` or `algorithms: [... 'none' ...]`"
    sanitizers:
      - "an explicit `algorithms: ['RS256']`-style allowlist that excludes none"
    known_false_positives:
      - Security test suites that deliberately construct `alg: none` tokens to assert rejection
    known_false_negatives:
      - Algorithm list built from a variable or config
      - Custom verification code that reads the header algorithm itself
      - Libraries whose *default* accepts any algorithm (see no-jwt-algorithm-confusion)
    prior_art:
