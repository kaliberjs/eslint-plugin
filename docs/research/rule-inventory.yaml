      - location.href / .search / .hash / .pathname
      - document.URL / documentURI / baseURI / referrer
      - window.name
      - "postMessage event.data"
      - "localStorage / sessionStorage / IndexedDB values"
      - "document.cookie"
    sinks:
      - "innerHTML / outerHTML / insertAdjacentHTML / document.write (see the dedicated rules)"
      - "eval / new Function / setTimeout(string)"
      - "location assignment, jQuery `$(x)` selector-or-HTML ambiguity"
      - "element.setAttribute with an event-handler attribute name"
      - "iframe srcdoc"
    sanitizers:
