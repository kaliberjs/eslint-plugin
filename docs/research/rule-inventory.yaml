      - "CodeQL js/unsafe-dynamic-method-access (adjacent)"
      - "CodeQL js/functionality-from-untrusted-source"
    references:
      - https://cwe.mitre.org/data/definitions/470.html
      - https://capec.mitre.org/data/definitions/138.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
    notes: >
      High false-positive risk is the whole story here: dynamic `require` is a normal design
      pattern, and `detect-non-literal-require` is one of the most commonly disabled rules in
