      false_positive_risk: 1
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "crypto.createCipheriv('aes-128-ecb' | 'aes-192-ecb' | 'aes-256-ecb', ...)"
      - "crypto.createCipher (deprecated; derives key and IV from a passphrase with MD5)"
      - "crypto-js with { mode: CryptoJS.mode.ECB }"
      - "any algorithm string ending in `-ecb`"
    sanitizers:
      - "authenticated modes: GCM, CCM, or ChaCha20-Poly1305; CBC with HMAC as a distant second"
    known_false_positives:
      - Single-block encryption of a fixed-size random value, where ECB is technically not weaker
      - Interop with a legacy protocol that mandates ECB
    known_false_negatives:
