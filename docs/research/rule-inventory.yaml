      - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
      - https://nodejs.org/api/crypto.html
    notes: >
      The honest tension: MD5-for-cache-keys is legitimate and common, so a blanket rule is noisy
      and a context-aware rule is guessing. Best design is a warn-level rule with an explicit
      `allowNonCryptographic` escape hatch and a suggestion to switch to SHA-256, plus an upgrade
      to error when the digest flows into a comparison or a password sink.

  - id: no-sha1-for-security
    family: cryptography
