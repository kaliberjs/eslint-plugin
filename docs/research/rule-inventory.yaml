      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    notes: >
      Same implementation as no-inner-html with a different sink table; there is a good argument
      for one rule with a sink registry rather than three rules. Keeping them separate in the
      inventory so the sink coverage is explicit and auditable.

  - id: no-document-write
    family: browser-dom
    title: Do not use document.write or document.writeln
    description: >
      `document.write` injects into the parser stream. Beyond XSS it destroys the document when
      called after load, blocks rendering, and is ignored for cross-origin scripts in Chrome on
      slow connections.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-79]
    cwe_parents: [CWE-74, CWE-707]
    capec: [CAPEC-588, CAPEC-63]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources:
      - location.search / location.hash / document.referrer
    sinks:
      - document.write(x) / document.writeln(x)
      - "iframe.contentDocument.write(x)"
      - "newWindow.document.write(x)"
    sanitizers:
      - "DOM construction with createElement/textContent (a fix, not a sanitizer)"
    known_false_positives:
      - Third-party tag-manager and ad snippets, which are written this way by the vendor
      - Legacy polyfill loaders
      - Deliberate writes into a freshly opened `about:blank` document for printing or previews
    known_false_negatives:
      - "`document['write'](x)` computed access"
      - Writes performed by an injected third-party script
    prior_art:
      - "eslint-plugin-no-unsanitized rule `method`"
      - "CodeQL js/xss-through-dom"
      - "CodeQL js/eval-like-call"
      - "Semgrep javascript/browser/security/insecure-document-method.yaml (id: insecure-document-method)"
    references:
      - https://cwe.mitre.org/data/definitions/79.html
