      - "CodeQL js/jwt-missing-verification"
    references:
      - https://cwe.mitre.org/data/definitions/347.html
      - https://www.rfc-editor.org/rfc/rfc8725.html
      - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-jwt-missing-verification/
    notes: >
      Near-perfect fit for an ESLint rule: a literal in an options object, catastrophic impact,
      essentially no false positives outside security tests. Prevalence is low precisely because
      libraries have hardened — but the cost is one hour, so the ratio still puts it in the first
      wave.

  - id: no-jwt-algorithm-confusion
    family: authentication-credentials
    title: Always pin the accepted JWT algorithms when verifying
    description: >
      `jwt.verify(token, key)` without an `algorithms` allowlist lets the token's own header
      choose. With an RSA public key as the secret, an attacker signs with HS256 using that
      public key as the HMAC secret and the signature verifies — the RSA-to-HMAC confusion attack.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-347]
    cwe_parents: [CWE-345, CWE-693]
    capec: [CAPEC-475]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "jsonwebtoken: jwt.verify(token, key) with no options.algorithms"
      - "jose: jwtVerify / compactVerify with no algorithms constraint"
      - "express-jwt / koa-jwt / fastify-jwt middleware configured without an algorithms list"
      - "passport-jwt JwtStrategy without algorithms"
      - "jwks-rsa key providers wired into verify without pinning"
    sanitizers:
      - "options.algorithms set to an explicit literal array of asymmetric or symmetric algorithms, consistently with the key type"
    known_false_positives:
      - Wrapper helpers that add `algorithms` before delegating (needs one level of intra-file reasoning)
      - Verification of a token the application itself just signed in the same process for testing
    known_false_negatives:
      - Options object spread from a config module
      - A custom verifier implementing signature checks by hand
      - Key type and algorithm mismatched even when algorithms *is* pinned
    prior_art:
      - "CodeQL js/jwt-missing-verification"
      - "SonarJS S5659 — 'JWT should be signed and verified with strong cipher algorithms' (CWE-347)"
      - "Semgrep javascript/jwt-simple/security/jwt-simple-noverify.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/347.html
      - https://www.rfc-editor.org/rfc/rfc8725.html
      - https://www.rfc-editor.org/rfc/rfc7519.html
      - https://github.com/advisories/GHSA-hjrf-2m68-5959
      - https://github.com/advisories/GHSA-qwph-4952-7xr6
    notes: >
      Two real advisories anchor this: GHSA-hjrf-2m68-5959 (CVE-2022-23541, jsonwebtoken key
      retrieval allowing RSA-to-HMAC forgery) and GHSA-qwph-4952-7xr6 (CVE-2022-23540, insecure
      default algorithm in jwt.verify). Requiring `algorithms` is a positive-obligation rule
      ("this option must be present"), which is a shape we should get right once and reuse.

  - id: no-jwt-decode-without-verify
    family: authentication-credentials
    title: Do not trust claims from a decoded-but-unverified JWT
    description: >
      `jwt.decode()` and `jwt_decode()` parse the payload without checking the signature. Using
      the resulting claims for authentication or authorization means trusting attacker-authored
      JSON.
    owasp_top10_2021: A07:2021-Identification and Authentication Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-347]
    cwe_parents: [CWE-345, CWE-693]
    capec: [CAPEC-475]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "jsonwebtoken: jwt.decode(token)"
      - "jwt-decode: jwtDecode(token)"
      - "jose: decodeJwt / decodeProtectedHeader"
      - "manual base64url payload parsing of a token string"
    sanitizers:
      - "jwt.verify / jwtVerify on the same token before the claims are used"
    known_false_positives:
      - Client-side code reading `exp` to decide when to refresh, which is a legitimate non-security use
      - Logging or debugging a token's claims
      - Reading the `kid` header to select a verification key, which is correct and necessary
    known_false_negatives:
      - Decode in one module, claim use in another
      - Verification performed by middleware the rule cannot see
    prior_art:
      - "Semgrep javascript/jsonwebtoken/security/audit/jwt-decode-without-verify.yaml (id: jwt-decode-without-verify)"
      - "Semgrep javascript/jwt-simple/security/jwt-simple-noverify.yaml"
      - "CodeQL js/jwt-missing-verification"
    references:
