      - "express-session / cookie-session `secret` literal"
    sanitizers:
      - "reading the secret from process.env or a secrets client"
      - "asymmetric keys loaded from a key file or KMS"
    known_false_positives:
      - Tests and fixtures, which use literal secrets by necessity
      - Local development defaults guarded by a NODE_ENV check
    known_false_negatives:
