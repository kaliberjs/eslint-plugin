      - https://cwe.mitre.org/data/definitions/295.html
      - https://cwe.mitre.org/data/definitions/297.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
      - https://nodejs.org/api/tls.html
      - https://codeql.github.com/codeql-query-help/javascript/js-disabling-certificate-validation/
    notes: >
      One of the best rules available to an ESLint plugin: a boolean literal in an options object,
      catastrophic impact, unambiguous intent, and a strong tendency to be added "temporarily" and
      never removed. Belongs in the first ten and is absent from the brief's proposed list — that
      is the main disagreement worth acting on.

  - id: no-node-tls-reject-unauthorized
    family: cryptography
    title: Never set NODE_TLS_REJECT_UNAUTHORIZED to 0
    description: >
      Setting this environment variable to `'0'` disables certificate verification for every TLS
      connection the process makes, including ones made by dependencies. Node itself emits a
      warning that this makes TLS connections insecure.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-295]
    cwe_parents: [CWE-287, CWE-284]
    capec: [CAPEC-459, CAPEC-475]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 5
      false_positive_risk: 1
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
      - "process.env['NODE_TLS_REJECT_UNAUTHORIZED'] = 0"
      - "Object.assign(process.env, { NODE_TLS_REJECT_UNAUTHORIZED: '0' })"
      - "the same assignment inside a dotenv default or a config module"
    sanitizers: []
    known_false_positives:
      - Test setup files and integration harnesses against a local self-signed server
      - One-off scripts that are never deployed
    known_false_negatives:
      - The variable set in a Dockerfile, CI config, shell profile or process manager, none of which ESLint sees
      - Value assigned from a variable rather than a literal
    prior_art:
      - "CodeQL js/disabling-certificate-validation (covers the environment-variable form)"
      - "SonarJS S4830 — 'Server certificates should be verified during SSL/TLS connections' (CWE-295)"
    references:
      - https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
      - https://cwe.mitre.org/data/definitions/295.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
    notes: >
      The single highest-confidence entry in the inventory: one exact assignment, process-wide
      blast radius, no legitimate production use. Should ship as an error with no autofix (deleting
      the line may break the developer's workflow; the correct fix is a CA, and that is a human
      decision). Note the honest limitation — most real instances of this live in shell and CI
      config, which a linter cannot see.

  - id: no-plain-http-url
    family: cryptography
    title: Do not make requests to hardcoded http:// endpoints
    description: >
      Cleartext HTTP exposes credentials, tokens and response bodies to any network observer and
      permits response tampering. The same applies to `ws://` and to package or script downloads
      over HTTP.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-319]
    cwe_parents: [CWE-311, CWE-693]
    capec: [CAPEC-102, CAPEC-117, CAPEC-65]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "fetch / axios / got / undici / node-fetch with an `http://` literal"
      - "new WebSocket('ws://...')"
      - "http.get / http.request with a non-localhost host"
      - "script/img/iframe src built from an http:// literal"
      - "npm/yarn registry or install-script URLs over http"
    sanitizers:
      - "https:// / wss://"
      - "protocol-relative or environment-driven base URLs"
    known_false_positives:
      - "localhost, 127.0.0.1, ::1, *.local, and container hostnames — the dominant case by far"
      - XML namespace URIs and schema identifiers, which are identifiers and not fetched
      - Documentation links and comments
      - Well-known non-fetched URLs (`http://www.w3.org/2000/svg`)
    known_false_negatives:
      - URL assembled from a protocol variable
      - Base URL from configuration
      - Mixed content introduced by a dependency
    prior_art:
      - "CodeQL js/insecure-download"
      - "CodeQL js/insecure-dependency"
      - "SonarJS S5332 — 'Clear-text protocols should not be used' (CWE-200, CWE-319)"
      - "SonarJS S5730 — 'Content Security Policy should block mixed-content' (CWE-319, CWE-311, CWE-693)"
      - "Semgrep javascript/lang/security/detect-insecure-websocket.yaml (id: detect-insecure-websocket)"
      - "Semgrep typescript/react/security/react-insecure-request.yaml (id: react-insecure-request)"
    references:
      - https://cwe.mitre.org/data/definitions/319.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    notes: >
      Cheap and mostly right, but the localhost and namespace-URI exceptions are mandatory, not
      optional — without them this rule is unusable. The `http://www.w3.org/2000/svg` false
      positive alone will fire in every SVG-containing component. Ship with a built-in exemption
      list plus a configurable one.
