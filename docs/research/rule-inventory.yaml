  - id: no-open-redirect
    family: redirects
    title: Do not redirect to a URL derived from the request
    description: >
      `res.redirect(req.query.next)` lets an attacker send the victim anywhere while the link
      appears to point at the trusted site — the standard phishing and OAuth-token-theft primitive.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-601]
    cwe_parents: [CWE-610, CWE-664]
    capec: [CAPEC-178]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - "req.query.next / returnTo / redirect_uri / continue / url"
      - "Referer header"
      - "a stored `redirectAfterLogin` value"
    sinks:
      - "res.redirect(x) / res.location(x)"
      - "res.setHeader('Location', x) plus a 3xx status"
      - "Next.js redirect() / NextResponse.redirect(x)"
      - "koa ctx.redirect(x), fastify reply.redirect(x)"
      - "OAuth `redirect_uri` echoed back without allowlist validation"
    sanitizers:
      - "an allowlist of literal paths or hosts, compared by equality"
      - "forcing a relative path: reject anything with a scheme or `//` prefix"
      - "new URL(x, base) followed by an origin equality check"
    known_false_positives:
      - Redirects to a path derived from a validated route parameter
      - Redirect targets from an internal allowlist that looks dynamic
      - Locale or trailing-slash normalisation redirects
      - Framework-level redirects to a computed internal path
    known_false_negatives:
      - Redirect target passed across modules (typical for auth flows)
      - "Protocol-relative bypass: `//evil.tld` is treated as relative by a naive check but absolute by the browser"
      - "Backslash and unicode-normalisation bypasses of a `startsWith('/')` check"
      - Redirect chains where only the second hop is tainted
    prior_art:
      - "CodeQL js/server-side-unvalidated-url-redirection"
      - "CodeQL js/client-side-unvalidated-url-redirection"
      - "Semgrep javascript/express/security/audit/express-open-redirect.yaml (id: express-open-redirect)"
      - "Semgrep javascript/browser/security/open-redirect.yaml (id: js-open-redirect)"
      - "Semgrep javascript/express/security/audit/possible-user-input-redirect.yaml"
      - "Semgrep javascript/angular/security/detect-angular-open-redirect.yaml"
