      plugin is. `react/no-danger` already flags the attribute unconditionally; the improvement is
      to allow a constant or registry-sanitized value and reserve the error for the rest, so the
      rule survives contact with JSON-LD. Belongs in the first ten.

  - id: no-javascript-url
    family: browser-dom
    title: Do not build javascript: or data: URLs, and do not assign unvalidated URLs to href/src
    description: >
      A `javascript:` URL in `href`, `src`, `action` or `formaction` executes on activation. If the
      URL comes from user data — a profile link, a redirect parameter, a CMS field — that is XSS
      with no HTML injection required.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-83]
    cwe_parents: [CWE-79, CWE-74, CWE-707]
    capec: [CAPEC-63, CAPEC-588]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources:
      - user-supplied profile/website URLs
      - CMS link fields
      - "`?next=` / `?returnTo=` parameters"
    sinks:
      - "a literal `javascript:` in href/src/action"
      - "<a href={x}> / <img src={x}> / <iframe src={x}> with a non-validated value"
      - "element.setAttribute('href'|'src'|'srcdoc'|'formaction', x)"
      - "location.href = x, location.assign(x), window.open(x)"
      - "`data:text/html` and `blob:` URLs assigned to iframe src"
    sanitizers:
      - "an explicit protocol allowlist after `new URL(x, base)` — http, https, mailto, tel"
      - "a scheme check that rejects javascript:, data:, vbscript: including whitespace and control-character variants"
    known_false_positives:
      - "`href=\"#\"` and `href=\"javascript:void(0)\"` in legacy code (still worth flagging, but as style)"
      - Bookmarklet authoring tools
      - Internal links built from a constant route table
    known_false_negatives:
      - Scheme obfuscation (`java\tscript:`, `JaVaScRiPt:`, HTML-entity encoded forms) if the check is a naive prefix match
      - URL validated in another module
      - Relative URLs that resolve to an attacker-controlled origin via a `<base>` tag
    prior_art:
      - "ESLint core no-script-url (verified in local eslint 9.39.4)"
      - "eslint-plugin-react react/jsx-no-script-url (verified locally)"
      - "CodeQL js/xss-through-dom"
      - "CodeQL js/incomplete-url-scheme-check"
      - "Semgrep typescript/react/security/audit/react-href-var.yaml (id: react-href-var)"
      - "Semgrep javascript/express/security/audit/xss/ejs/var-in-href.yaml"
