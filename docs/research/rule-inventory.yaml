  - id: no-ecb-mode
    family: cryptography
    title: Do not use ECB block cipher mode
    description: >
      ECB encrypts identical plaintext blocks to identical ciphertext blocks, leaking structure
      and permitting block reordering. It is never the right answer for application data.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: none
    cwe: [CWE-327]
