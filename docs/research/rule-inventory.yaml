  - id: no-session-fixation
    family: authentication-credentials
    title: Regenerate the session identifier on authentication
    description: >
      If the session id issued before login is still valid after login, an attacker who planted
      that id keeps an authenticated session. Frameworks expose `session.regenerate()` for this.
    owasp_top10_2021: A07:2021-Identification and Authentication Failures
