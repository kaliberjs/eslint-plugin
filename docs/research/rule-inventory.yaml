      - "Array/Buffer equality via JSON.stringify on secret material"
    sanitizers:
      - crypto.timingSafeEqual
      - "comparing HMACs of both values rather than the values"
    known_false_positives:
      - Comparing a secret against `undefined`/empty as a presence check
      - Comparing non-secret values whose identifier merely contains `token` or `key`
      - Local-network or CLI contexts where remote timing is not a threat
      - Comparisons where the secret is already public (a session id echoed back)
    known_false_negatives:
      - Comparison inside a helper with generic parameter names
      - Timing leaks through early `return` in a validation chain rather than through `===`
    prior_art:
