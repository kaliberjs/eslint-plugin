  - id: no-hardcoded-credentials
    family: authentication-credentials
    title: Do not pass hardcoded passwords or connection secrets to authentication APIs
    description: >
      A literal password, database password, or connection-string secret in source is committed
      to history, shipped to every developer and CI job, and cannot be rotated without a deploy.
      Detected positionally: a string literal in a parameter or property known to be a credential.
    owasp_top10_2021: A07:2021-Identification and Authentication Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
    cwe: [CWE-259]
    cwe_parents: [CWE-798, CWE-1391, CWE-1390, CWE-287, CWE-284]
    capec: [CAPEC-70, CAPEC-191]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "credential-named properties with literal values: password, passwd, pwd, secret, apiSecret, clientSecret, privateKey, connectionString, auth.pass"
      - "mysql/pg/mongodb createConnection/createPool/MongoClient options with a literal password"
      - "nodemailer transport auth.pass"
      - "basic-auth / http Authorization header built from literals"
      - "express-session / cookie-session secret option"
      - "jwt sign/verify secret argument (see no-weak-jwt-secret)"
    sanitizers:
      - "reading from process.env, a secret manager client, or a mounted secret file"
    known_false_positives:
      - Test fixtures, docker-compose-style local dev defaults, and example code
