      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "Handlebars: triple-stache in a template, `new Handlebars.SafeString(x)`, `noEscape: true`"
      - "Mustache: `mustache.escape = fn` override"
      - "EJS: `<%- %>`, `escape` option override"
      - "Pug: `!=` and `!{}` interpolation"
      - "Nunjucks: `autoescape: false`, `| safe`"
      - "Vue: `v-html`"
      - "Angular: DomSanitizer.bypassSecurityTrustHtml / TrustAs*"
    sanitizers:
      - "DOMPurify.sanitize immediately around the unescaped value (registry entry)"
      - "Angular: sanitize() rather than bypassSecurityTrust*"
    known_false_positives:
      - Rendering a value that is itself generated HTML from a trusted pipeline (markdown → sanitized HTML)
      - Email templates rendered server-side and never shown in a browser origin
