      - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
      - https://www.rfc-editor.org/rfc/rfc8725.html
    notes: >
      The three legitimate uses (refresh timing, logging, kid selection) are frequent enough that
      the rule needs either a same-file "was verify also called on this token" check or a
      documented allowlist of claim names. Even so, cost is low and the failure mode when wrong is
      total, so this belongs in the first wave alongside the other JWT rules.

  - id: no-weak-jwt-secret
    family: authentication-credentials
    title: Do not sign JWTs with a hardcoded, short, or default secret
    description: >
      An HMAC-signed JWT is only as strong as its secret. A literal in source, a short string, or
      a placeholder like `'secret'`/`'changeme'` means any attacker with the source (or a
      dictionary) can mint valid tokens.
    owasp_top10_2021: A02:2021-Cryptographic Failures
