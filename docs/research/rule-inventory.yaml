  - id: no-md5
    family: cryptography
    title: Do not use MD5 for any security purpose
    description: >
      MD5 is collision-broken and fast. Any use for signatures, integrity, password storage,
      token derivation or deduplication-with-security-meaning is a finding.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: none
