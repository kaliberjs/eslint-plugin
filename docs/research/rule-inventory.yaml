      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    notes: >
      CWE-83 (script in attributes) is the precise weakness rather than bare CWE-79. Two halves:
      the literal `javascript:` half is free (ESLint core already does it) and the
      dynamic-URL-in-href half needs either taint or a "was the protocol checked" heuristic. The
      second half is where the real bugs are.

  - id: no-dom-xss-sink
