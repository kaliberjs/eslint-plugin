  - id: no-server-side-template-injection
    family: injection
    title: Do not compile templates from non-literal template source
    description: >
      Passing user input as the *template* rather than as template *data* hands the attacker the
      template language, which in most JS engines means arbitrary JavaScript — `lodash.template`,
      `handlebars.compile`, `pug.render`, `ejs.render` with a tainted first argument are RCE.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-1336]
    cwe_parents: [CWE-94, CWE-74, CWE-707]
    capec: []
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.body / req.query used as template text
      - CMS-authored template fragments stored in a database
    sinks:
      - "lodash.template / _.template"
      - "handlebars.compile / precompile / Handlebars.SafeString"
      - "ejs.render / ejs.compile with the template string argument tainted"
      - "pug.render / pug.compile"
      - "nunjucks.renderString"
      - "mustache.render template argument"
      - "res.render with a tainted view name (template path injection)"
    sanitizers:
      - "moving the value into the data object instead of the template string (a fix, not a sanitizer)"
      - "engines configured with a strict sandbox and no property access (weak; historically bypassed)"
    known_false_positives:
      - Template text loaded from a trusted content directory at startup
      - Editor/preview tooling whose whole purpose is to compile author-supplied templates
    known_false_negatives:
      - Template text read from the database (second-order, needs cross-boundary reasoning)
      - Engine reached through a framework abstraction
    prior_art:
      - "CodeQL js/code-injection"
      - "CodeQL js/template-syntax-in-string-literal (adjacent: detects template syntax that never gets compiled)"
      - "Semgrep javascript/express/security/express-insecure-template-usage.yaml"
      - "Semgrep javascript/express/security/audit/res-render-injection.yaml"
      - "eslint-plugin-security detect-disable-mustache-escape (adjacent, escaping rather than SSTI)"
    references:
      - https://cwe.mitre.org/data/definitions/1336.html
      - https://portswigger.net/web-security/server-side-template-injection
      - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
      - https://github.com/advisories/GHSA-35jh-r3h4-6jhm
      - https://github.com/advisories/GHSA-w457-6q6x-cgp9
    notes: >
      MITRE lists no CAPEC for CWE-1336, so `capec` is empty rather than invented. The
      distinguishing check is positional: which *argument* is tainted. That is a small amount of
      registry data (per API, which parameter index is the template) and makes the rule precise.
      GHSA-w457-6q6x-cgp9 (handlebars, CVE-2019-19919) and GHSA-35jh-r3h4-6jhm (lodash.template,
      CVE-2021-23337) are real instances.

  - id: no-expression-language-injection
    family: injection
    title: Do not evaluate expression-language strings built from user input
    description: >
      JS-side expression evaluators — AngularJS `$parse`/`$eval`, JSONPath, JMESPath, `expr-eval`,
      `filtrex`, MongoDB `$expr` — accept a small language. Where that language can reach the
      prototype chain or host objects, evaluating attacker-supplied expressions is sandbox escape
      or full code execution.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-917]
    cwe_parents: [CWE-77, CWE-74, CWE-707]
    capec: []
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 3
      ecosystem_prevalence: 1
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - "req.query filter/sort parameters (the common shape: `?filter=<expression>`)"
      - saved-search or rule-builder records
    sinks:
      - "AngularJS: $parse, $eval, scope.$eval, $interpolate"
      - "JSONPath: jsonpath.query with a tainted path"
      - "expr-eval / filtrex / jexl / mathjs `evaluate`"
      - "MongoDB $expr / $where (overlaps no-nosql-injection)"
    sanitizers:
      - evaluators configured with an explicit, closed function/operator allowlist
      - parsing the expression into a validated AST before evaluation
    known_false_positives:
      - Expressions from a trusted admin-authored rules engine
      - AngularJS legacy code where the expression is a literal
      - mathjs used as a calculator feature, which is the intended use even with user input
    known_false_negatives:
      - Custom in-house evaluators the registry does not know about
      - Expression forwarded from a stored rule (second-order)
    prior_art:
      - "CodeQL js/angular-expression-in-url-attribute"
      - "CodeQL js/angular-disabling-sce"
      - "Semgrep javascript/angular/security/detect-angular-sce-disabled.yaml"
      - "Semgrep javascript/angular/security/detect-angular-element-taint.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/917.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
    notes: >
      Be honest: CWE-917 is a Java/Spring-shaped weakness and its JS analogue is thin. Included
      because the brief asks for the family, and because the mathjs/filtrex "safe evaluator"
      pattern is genuinely growing in filter-builder UIs. Low priority; likely never ships as its
      own rule and instead becomes registry entries under no-eval.

  - id: no-reflected-xss
    family: injection
    title: Do not write non-escaped request data into an HTTP response body
    description: >
      Server-side reflected XSS: request data reaches `res.send`/`res.write`/`res.end` inside an
      HTML response without contextual escaping, so the browser parses attacker markup in the
      application's origin.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-79]
    cwe_parents: [CWE-74, CWE-707]
    capec: [CAPEC-591, CAPEC-63]
    detectability: REQUIRES_INTERPROCEDURAL_ANALYSIS
    scores:
      security_impact: 4
      static_detectability: 3
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.query / req.body / req.params / req.headers / req.cookies
      - "error messages echoing input (`Unknown user ${name}`)"
    sinks:
      - "express: res.send / res.write / res.end / res.sendFile with built HTML"
      - "node:http: response.write / response.end"
      - "framework HTML responses: new Response(html), NextResponse with text/html"
      - "template engines invoked with autoescaping off (see no-template-autoescape-disabled)"
    sanitizers:
      - "context-correct escaping: he.encode, escape-html (HTML text context only)"
      - "DOMPurify.sanitize for fragments (registry entry)"
      - "setting Content-Type to text/plain or application/json"
      - "framework auto-escaping (React/JSX text children, Vue mustache interpolation)"
    known_false_positives:
      - JSON APIs where the response is never parsed as HTML but the sink looks the same
      - Values already escaped by a helper the registry does not recognise
      - Server-rendered frameworks whose escaping is implicit
      - Development-only error pages
    known_false_negatives:
      - Handler and renderer in different modules (the normal case)
      - Stored XSS through the database
      - Escaping that is context-wrong (HTML-escaped value placed in a JS or attribute context)
      - Content-Type sniffing turning a "safe" response into HTML
    prior_art:
      - "CodeQL js/reflected-xss"
      - "CodeQL js/stored-xss"
      - "CodeQL js/xss"
      - "CodeQL js/html-constructed-from-input"
      - "Semgrep javascript/express/security/audit/xss/direct-response-write.yaml"
      - "Semgrep javascript/express/security/injection/raw-html-format.yaml (id: raw-html-format)"
      - "SonarJS S5131 — UNVERIFIED (closed-source Sonar security engine)"
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-community/attacks/xss/
      - https://capec.mitre.org/data/definitions/591.html
    notes: >
      This is the rule the brief called "no-xss", and it is the weakest member of the XSS family
      for an ESLint plugin: source and sink are almost never in the same file, and escaping is
      contextual. The DOM-sink rules (no-inner-html, no-dangerously-set-inner-html,
      no-document-write) detect the same weakness class an order of magnitude more cheaply and
      precisely. Recommendation: do not ship a general server-side XSS rule in the first wave.

  - id: no-template-autoescape-disabled
    family: injection
    title: Do not disable a template engine's auto-escaping
    description: >
      `{{{ }}}` in Handlebars/Mustache, `<%- %>` in EJS, `!=` in Pug, `| safe` in Nunjucks, and
      `escapeFunction`/`noEscape` overrides all turn off the engine's XSS protection at exactly
      the point where it matters.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-79]
    cwe_parents: [CWE-74, CWE-707]
    capec: [CAPEC-63, CAPEC-592]
    detectability: STATICALLY_DETECTABLE
