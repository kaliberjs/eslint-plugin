      no-inner-html covers them if jQuery is present, rather than shipping a jQuery-specific rule.

  - id: no-sensitive-data-in-web-storage
    family: browser-dom
    title: Do not store tokens or personal data in localStorage or sessionStorage
    description: >
      Web storage is readable by any script in the origin, has no expiry, and survives the
      session. A JWT in `localStorage` is a permanent XSS payoff; an httpOnly cookie is not.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: none
    cwe: [CWE-922]
    cwe_parents: [CWE-664]
    capec: []
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 4
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "localStorage.setItem / sessionStorage.setItem with a token/secret/credential-named key or value"
      - "localStorage['accessToken'] = x"
      - "IndexedDB writes of credential-shaped objects"
      - "document.cookie = ... without HttpOnly (which client JS cannot set anyway)"
    sanitizers:
      - "an httpOnly, secure, sameSite cookie set by the server"
      - "in-memory storage for the lifetime of the tab"
    known_false_positives:
      - Storing a public identifier or a feature flag whose name matches the denylist
      - Deliberate, documented token storage in a SPA where the alternative is not available
      - Storing an already-encrypted blob
    known_false_negatives:
      - Token stored under a neutral key name
      - Whole auth-state object persisted by a state library (redux-persist, zustand persist) — very common and invisible to a name check
    prior_art:
      - "CodeQL js/clear-text-storage-of-sensitive-data"
      - "CodeQL js/build-artifact-leak (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/922.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    notes: >
      MITRE lists no CAPEC for CWE-922. Contested guidance — plenty of competent teams store
      access tokens in memory but refresh tokens nowhere, and plenty ship localStorage tokens
      deliberately. Ship at info level, or as an opt-in rule, with the state-persistence false
      negative documented since that is where most real instances hide.

