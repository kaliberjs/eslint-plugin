    cwe: [CWE-552]
    cwe_parents: [CWE-668, CWE-285, CWE-664, CWE-284]
    capec: [CAPEC-126]
    detectability: REQUIRES_INTERPROCEDURAL_ANALYSIS
    scores:
      security_impact: 5
      static_detectability: 3
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.query.file / req.params.path / req.body.template
    sinks:
      - "fs.readFile / readFileSync / createReadStream whose result reaches a response"
      - "res.sendFile / res.download"
      - "express.static serving a computed root"
      - "fs.promises.readdir exposing a listing"
    sanitizers:
      - basename plus an allowlist
      - a mapping from an opaque id to a server-side path
    known_false_positives:
      - Static-asset middleware with a constant root that only looks dynamic
      - Serving generated files from a temp directory keyed by a random id
      - Documentation/preview features intentionally reading from a content directory
    known_false_negatives:
      - Read and response in different modules
      - Read via a template engine's file resolution
      - Directory listing disclosure without a traversal (CWE-548 shape)
    prior_art:
      - "CodeQL js/exposure-of-private-files"
      - "CodeQL js/path-injection"
      - "Semgrep javascript/express/security/audit/express-res-sendfile.yaml (id: express-res-sendfile)"
      - "Semgrep javascript/express/security/audit/express-check-directory-listing.yaml (id: express-check-directory-listing)"
    references:
      - https://cwe.mitre.org/data/definitions/552.html
      - https://cwe.mitre.org/data/definitions/22.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
    notes: >
      Kept separate from no-path-traversal because the CWE is different (CWE-552, files accessible
      to external parties) and because "does the file content reach the response" is the part that
      makes it high-impact rather than merely suspicious. Requires read-to-response dataflow, so
      realistically this is a documented sub-case of the traversal rule rather than its own rule.

  - id: no-arbitrary-file-write
    family: filesystem
    title: Do not write to filesystem paths derived from user input
    description: >
      A write with an attacker-influenced path can overwrite application code, `.npmrc`,
      `authorized_keys`, or a systemd unit — which converts file write into code execution.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-73]
    cwe_parents: [CWE-642, CWE-610, CWE-20, CWE-668, CWE-664, CWE-707]
    capec: [CAPEC-13, CAPEC-73, CAPEC-76]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - "upload metadata: file.originalname, req.body.filename"
      - req.params used as a storage key
    sinks:
      - fs.writeFile / writeFileSync / appendFile / createWriteStream / mkdir / rename / copyFile
      - "multer diskStorage filename/destination callbacks"
      - "fs.chmod / chown with a tainted path"
      - "archive extraction (see no-zip-slip)"
    sanitizers:
      - "a server-generated filename (crypto.randomUUID) with the client name stored only as metadata"
      - basename plus an extension allowlist plus resolved-path containment
    known_false_positives:
      - Scaffolding tools and generators writing developer-specified paths
      - Cache and build-output writers with computed paths
      - Test fixtures writing to a temp directory
    known_false_negatives:
      - Filename chosen in one module and written in another
      - Extension-only validation that permits a traversal in the stem
      - Writes performed by a dependency (upload middleware, image processors)
    prior_art:
      - "CodeQL js/path-injection"
      - "CodeQL js/http-to-file-access"
      - "eslint-plugin-security detect-non-literal-fs-filename"
      - "Semgrep javascript/lang/security/audit/detect-non-literal-fs-filename.yaml (id: detect-non-literal-fs-filename)"
    references:
      - https://cwe.mitre.org/data/definitions/73.html
      - https://cwe.mitre.org/data/definitions/22.html
      - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
      - https://github.com/advisories/GHSA-3jfq-g458-7qm9
    notes: >
      CWE-73 (external control of file name or path) is the right weakness for the write case;
      CWE-22 is the traversal mechanism and is listed as context. GHSA-3jfq-g458-7qm9 (tar,
      CVE-2021-32804) is the canonical npm-ecosystem instance and also motivates no-zip-slip.

  - id: no-unrestricted-file-upload
    family: filesystem
    title: Configure upload middleware with size, count and type limits
    description: >
      `multer()` with no options accepts any file, any size, any name, into memory or disk.
      Without limits it is a denial-of-service vector; without a type check and a server-generated
      name it is a webshell-upload vector.
    owasp_top10_2021: A04:2021-Insecure Design
    owasp_api_top10_2023: API4:2023 - Unrestricted Resource Consumption
    cwe: [CWE-434]
    cwe_parents: [CWE-669, CWE-664]
    capec: [CAPEC-1]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "multer({}) with no `limits` and no `fileFilter`"
      - "multer.diskStorage with `filename` echoing file.originalname"
      - "express-fileupload without limits or with `safeFileNames` off"
      - "busboy / formidable without maxFileSize"
      - "body-parser / express.json with no `limit`"
    sanitizers:
      - "limits: { fileSize, files, fields }"
      - "a fileFilter checking the declared MIME type *and* server-side content sniffing"
      - "a server-generated filename plus storage outside the web root"
    known_false_positives:
      - Internal admin tooling with a trusted user set
      - Limits enforced at the reverse proxy or CDN instead
      - Upload configuration composed in another module
    known_false_negatives:
      - Type validation by extension only, which is bypassable
      - Content-Type trust without sniffing
      - Storage in a public bucket with a guessable key
    prior_art:
      - "SonarJS S5693 — 'HTTP request content length should be limited' (CWE-400, CWE-770)"
      - "CodeQL js/resource-exhaustion"
      - "CodeQL js/missing-rate-limiting (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/434.html
      - https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/
      - https://capec.mitre.org/data/definitions/1.html
    notes: >
      A positive-obligation configuration rule: "these options must be present". Cheap, and the
      missing-`limits` half is unambiguous. The dangerous-type half is much weaker because static
      analysis cannot evaluate whether a `fileFilter` is adequate — ship the limits check, mention
      the type check in docs.

  - id: no-zip-slip
    family: filesystem
    title: Validate archive entry paths before extracting
    description: >
      Archive formats store arbitrary entry names, including `../../etc/cron.d/x` and absolute
      paths. Extracting without checking that each resolved destination stays inside the target
      directory is arbitrary file write — the Zip Slip vulnerability.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-22]
    cwe_parents: [CWE-706, CWE-664]
    capec: [CAPEC-126, CAPEC-76]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources:
      - "archive entry names (entry.fileName, entry.path, header.name) — the source is inside the archive, not the request"
    sinks:
      - "path.join(destDir, entry.name) feeding a write or createWriteStream"
      - "adm-zip extractAllTo / extractEntryTo"
      - "unzipper / yauzl entry streams piped to a computed path"
      - "tar.x / tar.extract without a filter or `strip`"
      - "node-stream-zip, extract-zip, decompress"
    sanitizers:
      - "resolve the destination and assert it starts with destDir + path.sep"
      - "tar's `filter` / `onentry` rejecting absolute and `..` paths"
      - "libraries that containment-check by default (modern `tar` does; document the version)"
    known_false_positives:
      - Extracting archives the application itself produced
      - Build-time extraction of vendored dependencies
      - Libraries that already validate internally, so the user code looks unguarded but is safe
    known_false_negatives:
      - Symlink entries pointing outside the destination, which containment checks on the entry name do not catch
      - Extraction inside a dependency
      - Zip bombs, a different weakness (CWE-409)
    prior_art:
      - "CodeQL js/zipslip"
      - "SonarJS S5042 — 'Expanding archive files should not be done without controlling resource consumption' (CWE-409) — adjacent, covers zip bombs rather than zip slip"
      - "SonarJS S6096 — UNVERIFIED (closed-source Sonar security engine)"
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://security.snyk.io/research/zip-slip-vulnerability
      - https://codeql.github.com/codeql-query-help/javascript/js-zipslip/
      - https://github.com/advisories/GHSA-3jfq-g458-7qm9
    notes: >
      Unusually good fit for a linter: extraction is nearly always a single localised block, the
      unsafe shape (`path.join(dest, entry.name)` then write) is recognisable without cross-file
      taint, and there is no legitimate reason to omit the check. Note that Sonar's S5042 is about
      resource consumption (CWE-409), not zip slip — do not conflate them, and do not claim S6096
      until it is verified.

  - id: no-insecure-temp-file
    family: filesystem
    title: Do not create temporary files with predictable names in shared directories
    description: >
      A predictable path in `/tmp` is a symlink-attack and race-condition target: an attacker who
      pre-creates the path can redirect the write or read the contents.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-377]
    cwe_parents: [CWE-668, CWE-664]
    capec: [CAPEC-149, CAPEC-155]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "a literal '/tmp/...' path passed to an fs write"
      - "path.join(os.tmpdir(), '<fixed name>')"
      - "os.tmpdir() combined with Date.now() or a process id"
      - "fs.exists-then-write sequences (CWE-367 race shape)"
    sanitizers:
      - "fs.mkdtemp / mkdtempSync"
      - "the `tmp` / `tempy` packages with random names"
      - "fs.open with O_CREAT|O_EXCL"
    known_false_positives:
      - Single-user CLI tools and build scripts
      - Containers where `/tmp` is not shared with other principals
      - Deterministic cache paths that are intentionally reused
    known_false_negatives:
      - Temp path built in a helper
      - Predictable names inside a dependency
      - Directory created with overly permissive mode (CWE-379)
    prior_art:
      - "CodeQL js/insecure-temporary-file"
      - "CodeQL js/file-system-race"
      - "SonarJS S5443 — 'Temporary files should not be created in publicly writable directories' (CWE-377, CWE-379)"
    references:
      - https://cwe.mitre.org/data/definitions/377.html
      - https://cwe.mitre.org/data/definitions/379.html
      - https://codeql.github.com/codeql-query-help/javascript/js-insecure-temporary-file/
      - https://nodejs.org/api/crypto.html
    notes: >
      Low impact in containerised single-tenant deployments, which is most JS deployments — hence
      the modest impact score. Very cheap, and `fs.mkdtemp` is a clean suggested fix, so it is a
      reasonable "free" addition to a crypto/filesystem bundle rather than a headline rule.

  # =============================================================================================
  # FAMILY: deserialization-objects
  # =============================================================================================

  - id: no-unsafe-deserialization
    family: deserialization-objects
    title: Do not deserialize untrusted data with a format that can instantiate behaviour
    description: >
      `node-serialize`, `serialize-javascript` round-tripped through eval, `js-yaml` legacy
      `load`, and any format that reconstructs functions or class instances from the payload gives
      the attacker code execution or type confusion at parse time.
    owasp_top10_2021: A08:2021-Software and Data Integrity Failures
    owasp_api_top10_2023: none
    cwe: [CWE-502]
    cwe_parents: [CWE-913, CWE-664]
    capec: [CAPEC-586]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.body / req.cookies (a serialized session or state blob)
      - message-queue payloads, cache entries, uploaded files
    sinks:
      - "node-serialize unserialize()"
      - "funcster / cryo / serialize-to-js deserialization"
      - "js-yaml `load` with an unsafe schema (pre-4.x default)"
      - "eval-based revival of a serialize-javascript output"
      - "JSON.parse with a reviver that reconstructs prototypes or invokes methods"
      - "structured-clone-like custom deserializers that call constructors named in the payload"
    sanitizers:
      - "JSON.parse with no reviver"
      - "js-yaml `load` with the default safe schema (4.x) or explicit JSON_SCHEMA"
      - "schema validation of the parsed value before use"
    known_false_positives:
      - Deserializing data the application itself produced and signed
      - Build-time YAML/config parsing
      - Tests exercising a deserializer
    known_false_negatives:
      - Deserialization inside a dependency
      - Prototype-pollution-based gadget chains through plain JSON (see no-prototype-pollution-assignment)
      - Payload arriving from a database rather than the request
    prior_art:
      - "CodeQL js/unsafe-deserialization"
      - "Semgrep javascript/express/security/audit/express-third-party-object-deserialization.yaml (id: express-third-party-object-deserialization)"
      - "Semgrep javascript/serialize-javascript/security/audit/unsafe-serialize-javascript.yaml (id: unsafe-serialize-javascript)"
      - "SonarJS S5334 — UNVERIFIED (closed-source Sonar security engine)"
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html
      - https://capec.mitre.org/data/definitions/586.html
      - https://codeql.github.com/codeql-query-help/javascript/js-unsafe-deserialization/
    notes: >
      Mostly a known-bad-library list, which makes it cheap and precise but limited: the modern JS
      version of this weakness is prototype pollution and framework-specific server-function
      deserialization, not `node-serialize`. Recent advisories in the CWE-502 npm set are almost
      all framework deserialization (React Router turbo-stream, TanStack server functions), which
      no linter would catch. Keep the library list, do not oversell the rule.

  - id: no-prototype-pollution-assignment
    family: deserialization-objects
    title: Do not assign to a dynamically computed property without excluding prototype keys
    description: >
      `obj[key] = value` where `key` can be `__proto__`, `constructor` or `prototype` writes to
      the prototype chain, affecting every object in the process — turning a data write into
      denial of service, logic bypass, or a gadget for code execution.
    owasp_top10_2021: A08:2021-Software and Data Integrity Failures
    owasp_api_top10_2023: API3:2023 - Broken Object Property Level Authorization
    cwe: [CWE-1321]
    cwe_parents: [CWE-915, CWE-913, CWE-664]
    capec: [CAPEC-77]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - "req.body / req.query keys (qs produces nested objects, so `?__proto__[x]=y` is reachable)"
      - JSON.parse of untrusted input, then iterated
      - archive entry names, CSV headers, form field names
    sinks:
      - "target[key] = value with a non-literal key"
      - "target[a][b] = value walking a tainted path array"
      - "Object.defineProperty / Reflect.set with a computed key"
      - "recursive copy loops (see no-unsafe-object-merge)"
    sanitizers:
      - "rejecting the keys `__proto__`, `constructor`, `prototype` explicitly"
      - "Object.create(null) or a Map as the target"
      - "Object.hasOwn / hasOwnProperty guard on the source, plus a key allowlist"
      - "Object.freeze(Object.prototype) at startup (process-level mitigation, not per-site)"
    known_false_positives:
      - "Every legitimate dynamic-property write: reducers, groupers, memo caches, i18n bundles, index building"
      - Keys that are provably from a literal set or an enum
      - Writes to a `Map` or a `null`-prototype object where the weakness does not apply
      - Class instances where the key set is fixed
    known_false_negatives:
      - Path array built in another module
      - Pollution through a dependency's merge/clone/set helper (the most common real-world vector)
      - "`Object.assign` / spread with a tainted source object"
    prior_art:
      - "CodeQL js/prototype-polluting-assignment"
      - "CodeQL js/prototype-pollution-utility"
      - "CodeQL js/invalid-prototype-value"
      - "Semgrep javascript/lang/security/audit/prototype-pollution/prototype-pollution-assignment.yaml (id: prototype-pollution-assignment)"
      - "Semgrep javascript/lang/security/audit/prototype-pollution/prototype-pollution-loop.yaml (id: prototype-pollution-loop)"
      - "eslint-plugin-security detect-object-injection (the same syntax, much broader and far noisier)"
      - "ESLint core no-proto (adjacent: literal `__proto__` access only)"
    references:
      - https://cwe.mitre.org/data/definitions/1321.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-prototype-polluting-assignment/
      - https://github.com/advisories/GHSA-jf85-cpcp-j695
      - https://github.com/advisories/GHSA-vh95-rmgr-6w4m
    notes: >
      CWE-1321 is a Variant under CWE-915, not a peer — worth stating because the two are often
      cited interchangeably. `detect-object-injection` is the cautionary tale here: it fires on
      every computed member expression and is one of the most-disabled security rules in the
      ecosystem. The taint-gated form is the only defensible version. Real instances:
      GHSA-jf85-cpcp-j695 (lodash, CVE-2019-10744), GHSA-vh95-rmgr-6w4m (minimist, CVE-2020-7598).

  - id: no-unsafe-object-merge
    family: deserialization-objects
    title: Do not deep-merge or deep-clone untrusted objects into trusted ones
    description: >
      A recursive merge that copies `source.__proto__` or walks a `constructor.prototype` path
      pollutes the prototype. This is the single most exploited prototype-pollution shape in the
      npm ecosystem.
    owasp_top10_2021: A08:2021-Software and Data Integrity Failures
    owasp_api_top10_2023: API3:2023 - Broken Object Property Level Authorization
    cwe: [CWE-1321]
    cwe_parents: [CWE-915, CWE-913, CWE-664]
    capec: [CAPEC-77]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.body / req.query passed as a merge source
      - a parsed config or JSON document from an untrusted origin
    sinks:
      - "lodash merge / mergeWith / defaultsDeep / set / setWith with a tainted source or path"
      - "Object.assign(target, req.body) where target is a shared object or a prototype"
      - "deepmerge, merge-deep, deep-extend, `$.extend(true, ...)`"
      - "a hand-written recursive `for (const k in src)` copy without a hasOwn/key guard"
      - "config libraries merging request-derived overrides"
    sanitizers:
      - "merging into Object.create(null)"
      - "an explicit field allowlist (pick) rather than a merge"
      - "schema validation with unknown-key stripping before the merge"
      - "structuredClone of the source, which drops the prototype"
    known_false_positives:
      - Merging application-controlled defaults, which is the normal use of these functions
      - Component prop merging in UI code
      - Test helpers building fixtures
    known_false_negatives:
      - Merge inside a dependency (the historical CVE pattern)
      - Source object reshaped through helpers before the merge
      - Pollution via array index paths
    prior_art:
      - "CodeQL js/prototype-pollution"
      - "CodeQL js/prototype-pollution-utility"
      - "Semgrep javascript/lang/security/insecure-object-assign.yaml (id: insecure-object-assign)"
      - "Semgrep javascript/lang/security/audit/prototype-pollution/prototype-pollution-loop.yaml (id: prototype-pollution-loop)"
    references:
      - https://cwe.mitre.org/data/definitions/1321.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-prototype-pollution/
      - https://github.com/advisories/GHSA-jf85-cpcp-j695
      - https://github.com/advisories/GHSA-9c47-m6qq-7p4h
      - https://github.com/advisories/GHSA-c4w7-xm78-47vh
    notes: >
      More tractable than the general assignment rule because the sink is a *named function* with
      a known dangerous parameter position, so the registry does most of the work. Three verified
      real-world instances: lodash (CVE-2019-10744), JSON5 (CVE-2022-46175), y18n (CVE-2020-7774).
      Best of the prototype-pollution family for a first implementation.

  - id: no-dangerous-dynamic-property-access
    family: deserialization-objects
    title: Do not read or invoke a property selected by user input
    description: >
      `obj[userKey]` can read `constructor`, and `obj[userKey]()` can invoke arbitrary methods
      including `constructor.constructor` — which is `Function` — giving code execution. Reading
      can also leak fields the caller was not meant to see.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: API3:2023 - Broken Object Property Level Authorization
    cwe: [CWE-915]
    cwe_parents: [CWE-913, CWE-664]
    capec: []
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 4
      confidence: 2
      false_positive_risk: 5
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.query / req.body field names used as lookup keys
      - "GraphQL field arguments naming a handler or column"
    sinks:
      - "obj[tainted] read where obj is a module or namespace object"
      - "obj[tainted](...) — dynamic method dispatch"
      - "handlers[req.body.action]() dispatch tables"
      - "sort/filter builders indexing by a client-supplied column name"
    sanitizers:
      - "Object.hasOwn(map, key) plus a Map or null-prototype container"
      - "membership test against a literal allowlist"
      - "a switch statement over literal cases"
    known_false_positives:
      - "Ordinary dynamic lookup, which is idiomatic JavaScript and enormously common"
      - Array indexing with a validated integer
      - Well-guarded dispatch tables where the guard is one line away
      - TypeScript code where the key type is a literal union and the compiler proves safety
    known_false_negatives:
      - Key computed in another module
      - Dispatch through a framework router
      - Access to inherited properties that the analysis treats as own-property-safe
    prior_art:
      - "CodeQL js/remote-property-injection"
      - "CodeQL js/unsafe-dynamic-method-access"
      - "CodeQL js/unvalidated-dynamic-method-call"
      - "CodeQL js/template-object-injection"
      - "Semgrep javascript/lang/security/audit/unsafe-dynamic-method.yaml (id: unsafe-dynamic-method)"
      - "Semgrep javascript/express/security/audit/remote-property-injection.yaml (id: remote-property-injection)"
      - "eslint-plugin-security detect-object-injection"
    references:
      - https://cwe.mitre.org/data/definitions/915.html
      - https://codeql.github.com/codeql-query-help/javascript/js-remote-property-injection/
      - https://cheatsheetseries.owasp.org/cheatsheets/Prototype_Pollution_Prevention_Cheat_Sheet.html
    notes: >
      MITRE lists no CAPEC for CWE-915. Scored with fp_risk 5 deliberately: this is
      `detect-object-injection`, and its reputation is earned. The only version worth shipping is
      the *invocation* half (`obj[tainted](...)`), where the impact is code execution and the
      pattern is rare — not the read half. In a TypeScript codebase with `noUncheckedIndexedAccess`
      much of this is already handled by the type system, which is a better answer than a lint rule.

  - id: no-mass-assignment
    family: deserialization-objects
    title: Do not pass a whole request body into a model create or update
    description: >
      `User.update(req.body)` lets the client set any writable field — `isAdmin`, `role`,
      `emailVerified`, `balance`. The fix is an explicit field allowlist.
    owasp_top10_2021: A04:2021-Insecure Design
    owasp_api_top10_2023: API3:2023 - Broken Object Property Level Authorization
    cwe: [CWE-915]
    cwe_parents: [CWE-913, CWE-664]
    capec: []
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.body used directly as an entity payload
    sinks:
      - "mongoose Model.create / findByIdAndUpdate / updateOne with req.body"
      - "sequelize Model.create / update with req.body and no `fields` option"
      - "prisma create/update `data: req.body`"
      - "typeorm repository.save(req.body)"
      - "Object.assign(entity, req.body)"
    sanitizers:
      - "an explicit pick of allowed fields"
      - "a validated DTO from zod/joi/class-validator with unknown keys stripped"
      - "sequelize's `fields` option; mongoose schema `strict` plus a select-based update"
    known_false_positives:
      - A validated DTO that is still named or reachable like the body
      - Admin endpoints where full-object update is the intent
      - Schemas that are strict enough that extra fields are dropped anyway
      - Internal service-to-service handlers
    known_false_negatives:
      - Body reshaped through a helper before the model call
      - Nested-object mass assignment past a shallow allowlist
      - ORMs the registry does not model
    prior_art:
      - "CodeQL js/remote-property-injection (adjacent)"
      - "CodeQL js/type-confusion-through-parameter-tampering (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/915.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
    notes: >
      The clearest API-Top-10 mapping in the inventory (API3:2023). Detection is a one-hop check —
      does `req.body` reach an ORM write argument without an intervening pick or parse — which the
      intra-file taint layer can already answer. The false-positive driver is validated DTOs, so
      the registry needs zod/joi/class-validator `parse` results treated as sanitized.

  # =============================================================================================
  # FAMILY: regex
  # =============================================================================================

  - id: no-unsafe-regex
    family: regex
    title: Do not use regular expressions with exponential backtracking
    description: >
      Nested quantifiers and overlapping alternations — `(a+)+`, `(a|a)*`, `(\s*,)*` — make
      matching exponential in the input length, so one crafted string blocks the event loop and
      takes the whole process down.
    owasp_top10_2021: A05:2021-Security Misconfiguration
    owasp_api_top10_2023: API4:2023 - Unrestricted Resource Consumption
    cwe: [CWE-1333]
    cwe_parents: [CWE-407, CWE-405, CWE-400, CWE-664]
    capec: [CAPEC-492]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 4
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: false
    sources:
      - "any request-derived string tested against the pattern (needed only to upgrade severity)"
    sinks:
      - regex literals with nested quantifiers or ambiguous alternation
      - "new RegExp('<literal>') with the same shapes"
      - "patterns used in .test / .match / .replace / .split / router path definitions"
    sanitizers:
      - "rewriting to a non-ambiguous pattern (possessive/atomic behaviour is unavailable in JS)"
      - "bounding input length before matching"
      - "a linear-time engine (RE2 via `re2` bindings)"
    known_false_positives:
      - Patterns only ever applied to short, bounded, application-controlled strings
      - Build-time and codegen patterns
      - Patterns whose theoretical blow-up needs an input longer than any real one
      - Test fixtures that deliberately contain pathological patterns
    known_false_negatives:
      - "Polynomial (not exponential) backtracking, which still causes real DoS — see no-polynomial-redos"
      - Patterns assembled at runtime from parts
      - Patterns inside dependencies (historically where most ReDoS CVEs live)
      - "Backtracking triggered by lookarounds and backreferences, which simple analyses miss"
    prior_art:
      - "CodeQL js/redos"
      - "eslint-plugin-security detect-unsafe-regex"
      - "Semgrep javascript/lang/security/audit/detect-redos.yaml (id: detect-redos)"
      - "SonarJS S5852 — 'Regular expressions should not cause catastrophic backtracking' (CWE-1333)"
    references:
      - https://cwe.mitre.org/data/definitions/1333.html
      - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
      - https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-redos/
      - https://github.com/advisories/GHSA-c2qf-rxjj-qqgw
      - https://github.com/advisories/GHSA-9wv6-86v2-598j
    notes: >
      Implementation cost is the honest 4: doing this properly means building an NFA-ambiguity
      analysis, not pattern-matching on `(x+)+`. There is no OWASP cheat sheet for regular
      expressions (checked); the www-community ReDoS page is the primary source. Real instances are
      abundant: GHSA-c2qf-rxjj-qqgw (semver, CVE-2022-25883), GHSA-9wv6-86v2-598j (path-to-regexp,
      CVE-2024-45296), GHSA-f8q6-p94x-37v3 (minimatch, CVE-2022-3517). Consider depending on an
      existing analysis rather than writing one.

  - id: no-polynomial-redos
    family: regex
    title: Do not apply super-linear patterns to unbounded user input
    description: >
      Even without nested quantifiers, patterns like `^\s+|\s+$` or `.*foo.*` are quadratic on
      crafted input. Applied to a large request body they are a practical denial of service.
    owasp_top10_2021: A05:2021-Security Misconfiguration
    owasp_api_top10_2023: API4:2023 - Unrestricted Resource Consumption
    cwe: [CWE-1333]
    cwe_parents: [CWE-407, CWE-405, CWE-400, CWE-664]
    capec: [CAPEC-492]
    detectability: REQUIRES_INTERPROCEDURAL_ANALYSIS
    scores:
      security_impact: 3
      static_detectability: 3
      ecosystem_prevalence: 4
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.body / req.query strings of unbounded length
      - file contents, uploaded documents
    sinks:
      - trim-style patterns applied to request data
      - "`.replace(/\\s+/g, ...)` chains over large inputs"
      - "sanitisation libraries running many patterns over one string"
    sanitizers:
      - length limits before matching
      - String.prototype.trim / replaceAll with string arguments
    known_false_positives:
      - Patterns applied to short inputs whose length is bounded by validation
      - Client-side use where the only victim is the attacker's own browser
    known_false_negatives:
      - Taint arriving from another module
      - Cumulative cost across many individually-cheap patterns
    prior_art:
      - "CodeQL js/polynomial-redos"
      - "CodeQL js/resource-exhaustion"
    references:
      - https://cwe.mitre.org/data/definitions/1333.html
      - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
      - https://codeql.github.com/codeql-query-help/javascript/js-polynomial-redos/
      - https://github.com/advisories/GHSA-7fh5-64p2-3v2j
    notes: >
      Needs taint to be useful (a quadratic pattern on a bounded string is fine), which is why
      CodeQL keeps it as a separate query from js/redos. Documented for completeness; realistically
      out of scope for this plugin. GHSA-7fh5-64p2-3v2j (postcss, CVE-2023-44270) is a real
      instance of the shape.

  - id: no-user-controlled-regexp
    family: regex
    title: Do not build regular expressions from user input
    description: >
      `new RegExp(userInput)` lets the attacker choose the pattern: a catastrophic pattern is
      denial of service, and in a security check (an allowlist match) a crafted pattern changes
      what the check accepts.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: API4:2023 - Unrestricted Resource Consumption
    cwe: [CWE-1333]
    cwe_parents: [CWE-407, CWE-405, CWE-400, CWE-664]
    capec: [CAPEC-492]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: true
    sources:
      - "req.query.search / req.body.pattern (search and filter features are the usual shape)"
      - stored user-authored rules
    sinks:
      - new RegExp(x) / RegExp(x) with a non-literal argument
      - "String.prototype.match / replace / split given a constructed RegExp"
      - "MongoDB $regex with a client-supplied pattern"
    sanitizers:
      - "escaping regex metacharacters in the interpolated segment (escape-string-regexp)"
      - "using indexOf / includes instead of a regex for substring search"
      - "a linear-time engine, or a pattern-complexity guard"
    known_false_positives:
      - Patterns built from application constants at module load
      - Dynamic patterns built from an already-escaped identifier
      - Developer-facing tooling where regex input is the feature
      - i18n/route table construction
    known_false_negatives:
      - Pattern assembled in another module
      - Regex reaching a dependency's matcher
      - Regex injection into a MongoDB query object
    prior_art:
      - "CodeQL js/regex-injection"
      - "eslint-plugin-security detect-non-literal-regexp"
      - "Semgrep javascript/lang/security/audit/detect-non-literal-regexp.yaml (id: detect-non-literal-regexp)"
    references:
      - https://cwe.mitre.org/data/definitions/1333.html
      - https://codeql.github.com/codeql-query-help/javascript/js-regex-injection/
      - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    notes: >
      Cheapest rule in the regex family (one AST node), but `detect-non-literal-regexp` is noisy
      in practice because building patterns from constants is normal. Taint-gate it, or restrict to
      the case where the constructed regex is used in a comparison that gates access.

  # =============================================================================================
  # FAMILY: logging
  # =============================================================================================

  - id: no-secret-in-log
    family: logging
    title: Do not log passwords, tokens, keys or secrets
    description: >
      Logs are aggregated, retained, replicated to third-party services and read by people who
      are not authorised to see the credentials in them. A logged secret is a leaked secret.
    owasp_top10_2021: A09:2021-Security Logging and Monitoring Failures
    owasp_api_top10_2023: none
    cwe: [CWE-532]
    cwe_parents: [CWE-538, CWE-200, CWE-668, CWE-664]
    capec: [CAPEC-215]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 4
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "console.log / info / warn / error / debug with an argument whose identifier or property path matches password, passwd, secret, token, apiKey, privateKey, credentials, sessionId, ssn, creditCard, cvv"
      - "pino / winston / bunyan / debug calls with the same"
      - "Sentry/Rollbar captureException with a context object containing credentials"
      - "logging an entire user or credentials object"
    sanitizers:
      - "a redaction configuration (pino `redact`, winston format that strips fields)"
      - "logging only an identifier or a hash"
      - "explicit field selection instead of the whole object"
    known_false_positives:
      - Logging that a token is *absent* or logging its length
      - Identifiers containing `token` that are not secrets (lexer tokens, design tokens, CSRF token presence)
      - Development-only logging behind a debug flag
      - Loggers with a redaction layer the rule cannot see
    known_false_negatives:
      - Secret nested inside an object that is logged wholesale under a neutral name
      - Secret logged after being renamed to a neutral identifier
      - Secrets written to a file or a metrics label rather than a logger
      - Secrets in an error object's message
    prior_art:
      - "CodeQL js/clear-text-logging"
      - "CodeQL js/clear-text-storage-of-sensitive-data"
      - "SonarJS S5757 — 'Confidential information should not be logged' (CWE-532)"
      - "Semgrep javascript/jsonwebtoken/security/audit/jwt-exposed-data.yaml"
      - "Semgrep javascript/jose/security/audit/jose-exposed-data.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/532.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-clear-text-logging/
      - https://capec.mitre.org/data/definitions/215.html
    notes: >
      Name-based, which normally means unreliable — but here the asymmetry helps: a false negative
      costs nothing extra (the secret was already going to be logged) while a true positive is a
      real leak caught for the price of an identifier match. The configurable-denylist design is
      the right one, and this is the best rule in the logging family.

  - id: no-authorization-header-log
    family: logging
    title: Do not log request headers wholesale
    description: >
      `console.log(req.headers)` prints `Authorization`, `Cookie`, `X-Api-Key` and
      `Proxy-Authorization` — every credential the client sent — into the log stream.
    owasp_top10_2021: A09:2021-Security Logging and Monitoring Failures
    owasp_api_top10_2023: none
    cwe: [CWE-532]
    cwe_parents: [CWE-538, CWE-200, CWE-668, CWE-664]
    capec: [CAPEC-215]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "logging req.headers / request.headers / event.headers (Lambda) / ctx.request.header"
      - "logging req.headers.authorization / .cookie / ['x-api-key'] specifically"
      - "logging req.cookies"
      - "attaching headers to an error report or a span attribute"
    sanitizers:
      - "logging a named subset of non-sensitive headers"
      - "a redaction list covering authorization, cookie, set-cookie, x-api-key, proxy-authorization"
    known_false_positives:
      - Debug logging in local development
      - Logging headers of an *outgoing* request the application constructed itself with no credentials
      - Header logging in test code
    known_false_negatives:
      - Headers spread into a larger object that is then logged
      - Headers logged by a middleware or an APM agent
    prior_art:
      - "CodeQL js/clear-text-logging"
      - "SonarJS S5757 — 'Confidential information should not be logged' (CWE-532)"
    references:
      - https://cwe.mitre.org/data/definitions/532.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    notes: >
      A specific, syntactic, high-confidence slice of no-secret-in-log — `req.headers` as a logger
      argument. Cheap enough to be worth having as its own check even if it is folded into the same
      rule implementation.

  - id: no-request-body-log
    family: logging
    title: Do not log entire request bodies on credential-handling routes
    description: >
      Logging `req.body` on a login, registration, password-reset, payment or profile route writes
      passwords, card numbers and personal data to the log stream.
    owasp_top10_2021: A09:2021-Security Logging and Monitoring Failures
    owasp_api_top10_2023: none
    cwe: [CWE-532]
    cwe_parents: [CWE-538, CWE-200, CWE-668, CWE-664]
    capec: [CAPEC-215]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 4
      confidence: 2
      false_positive_risk: 4
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "console.* / logger.* with req.body, request.body, ctx.request.body, event.body"
      - "JSON.stringify(req.body) inside a log call"
      - "error reports attaching the request body as context"
    sanitizers:
      - "logging a redacted projection of the body"
      - "logging only field names or a body size"
    known_false_positives:
      - Debug logging on routes that carry no sensitive data
      - Local development middleware
      - Webhook receivers logging payloads for replay, which is often a deliberate operational choice
    known_false_negatives:
      - Body logged after destructuring into locals
      - Body captured by an APM agent's automatic instrumentation
      - Sensitive data in the query string rather than the body (CodeQL js/sensitive-get-query covers this)
    prior_art:
      - "CodeQL js/clear-text-logging"
      - "CodeQL js/sensitive-get-query"
      - "SonarJS S5757 — 'Confidential information should not be logged' (CWE-532)"
    references:
      - https://cwe.mitre.org/data/definitions/532.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    notes: >
      Confidence is 2 because "is this route sensitive" is not visible in the file. Only worth
      shipping if it can be scoped — e.g. fire when the same function also references a
      password/card/token field. Otherwise it is a debug-logging tax.

  # =============================================================================================
  # FAMILY: browser-dom
  # =============================================================================================

  - id: no-inner-html
    family: browser-dom
    title: Do not assign non-literal values to innerHTML or outerHTML
    description: >
      Assigning a string to `innerHTML`/`outerHTML` parses it as HTML. Any attacker-influenced
      substring becomes markup, and `<img src=x onerror=...>` executes in the page's origin
      without needing a `<script>` tag.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-79]
    cwe_parents: [CWE-74, CWE-707]
    capec: [CAPEC-588, CAPEC-63]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources:
      - location.hash / location.search / location.pathname / document.referrer
      - "window.name, postMessage event.data"
      - localStorage / sessionStorage values
      - API responses containing user-authored content
    sinks:
      - "element.innerHTML = x"
      - "element.outerHTML = x"
      - "Element.prototype.setHTMLUnsafe(x)"
      - "$(el).html(x) (jQuery)"
      - "svg.innerHTML and template.innerHTML"
    sanitizers:
      - "DOMPurify.sanitize(x)"
      - "textContent instead of innerHTML (a fix, not a sanitizer)"
      - "Element.setHTML() with a Sanitizer configuration"
      - "Trusted Types policy objects (createHTML)"
    known_false_positives:
      - "Clearing an element: `el.innerHTML = ''`"
      - Assigning a template literal with no substitutions
      - Assigning markup the application generated from a sanitized markdown pipeline
      - Icon/SVG injection from a build-time constant map
      - Tests building DOM fixtures
    known_false_negatives:
      - Assignment through a helper (`setHtml(el, value)`)
      - "`insertAdjacentHTML` and `document.write`, which are separate sinks"
      - Framework-level HTML injection (`dangerouslySetInnerHTML`, `v-html`)
      - Sanitizer configured permissively enough to still allow script
    prior_art:
      - "eslint-plugin-no-unsanitized rule `property` (verified: the plugin provides exactly `method` and `property`)"
      - "CodeQL js/xss-through-dom"
      - "CodeQL js/xss"
      - "Semgrep javascript/browser/security/insecure-innerhtml.yaml (id: insecure-innerhtml)"
      - "Semgrep javascript/jquery/security/audit/prohibit-jquery-html.yaml"
      - "Semgrep javascript/browser/security/raw-html-concat.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/79.html
      - https://developer.mozilla.org/en-US/docs/Web/API/Element/innerHTML
      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - https://capec.mitre.org/data/definitions/588.html
    notes: >
      This is the rule that should replace the brief's generic "no-xss" in the first ten. Same
      weakness (CWE-79), one AST node, no taint required, and the `= ''` and no-substitution
      template cases cover most of the false-positive surface with two trivial exemptions. Note
      that `eslint-plugin-no-unsanitized/property` already does this well — our value is
      integrating it into the shared severity/confidence model and covering the jQuery and
      `setHTMLUnsafe` sinks.

  - id: no-insert-adjacent-html
    family: browser-dom
    title: Do not pass non-literal values to insertAdjacentHTML
    description: >
      `insertAdjacentHTML` is an HTML parser entry point with the same consequences as
      `innerHTML`, and it is frequently missed because it looks like a DOM insertion API rather
      than a string-to-markup one.
    owasp_top10_2021: A03:2021-Injection
    owasp_api_top10_2023: none
    cwe: [CWE-79]
    cwe_parents: [CWE-74, CWE-707]
    capec: [CAPEC-588, CAPEC-63]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources:
      - location.* / document.referrer / postMessage data / storage values
    sinks:
      - "element.insertAdjacentHTML(position, x)"
      - "$(el).append/prepend/before/after(x) with an HTML string (jQuery)"
      - "Range.createContextualFragment(x)"
      - "DOMParser.parseFromString(x, 'text/html') followed by adoption into the live document"
    sanitizers:
      - DOMPurify.sanitize
      - insertAdjacentText
      - Trusted Types createHTML
    known_false_positives:
      - Inserting build-time constant markup
      - Component libraries inserting their own generated templates
    known_false_negatives:
      - Call through a wrapper helper
      - jQuery insertion where the argument is ambiguous between selector and HTML
    prior_art:
      - "eslint-plugin-no-unsanitized rule `method`"
      - "CodeQL js/xss-through-dom"
      - "Semgrep javascript/jquery/security/audit/jquery-insecure-method.yaml"
      - "Semgrep javascript/fbjs/security/audit/insecure-createnodesfrommarkup.yaml"
    references:
