      no-postmessage-without-origin-check as one "cross-origin messaging" rule.

  - id: no-target-blank-without-noopener
    family: browser-dom
    title: Add rel="noopener" to links and window.open calls that open new windows
    description: >
      Without `noopener`, the opened document gets a `window.opener` reference and can navigate the
      original page — reverse tabnabbing. Modern browsers imply `noopener` for `target="_blank"`
      anchors, but not for `window.open`.
    owasp_top10_2021: none
    owasp_api_top10_2023: none
    cwe: [CWE-1022]
    cwe_parents: [CWE-284]
    capec: []
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 2
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "<a target=\"_blank\"> without rel containing noopener (and, for older browsers, noreferrer)"
      - "window.open(url) without 'noopener' in the windowFeatures argument"
      - "a dynamically created anchor with target set and rel unset"
    sanitizers:
      - "rel=\"noopener\" / rel=\"noopener noreferrer\""
      - "window.open(url, name, 'noopener')"
    known_false_positives:
      - Deliberate opener use for OAuth popups and payment flows that need to postMessage back
      - Same-origin links where the risk is nil
      - Browsers where `_blank` already implies noopener, making the anchor case cosmetic
    known_false_negatives:
