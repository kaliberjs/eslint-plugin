  - id: no-timing-unsafe-secret-comparison
    family: authentication-credentials
    title: Compare secrets with a constant-time function
    description: >
      `===` on strings short-circuits at the first differing byte, so comparing a token, HMAC
      signature or API key with `===` leaks its prefix through response timing.
      `crypto.timingSafeEqual` exists for this.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API2:2023 - Broken Authentication
