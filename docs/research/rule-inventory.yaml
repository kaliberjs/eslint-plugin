  - id: no-static-iv
    family: cryptography
    title: Do not reuse a constant initialization vector or nonce
    description: >
      A constant IV with CBC makes the first block deterministic and leaks equality; a repeated
      nonce with GCM or ChaCha20-Poly1305 is catastrophic — it leaks the authentication key and
      allows forgery. `crypto.randomBytes` per message is the fix.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: none
    cwe: [CWE-329, CWE-1204]
    cwe_parents: [CWE-1204, CWE-573, CWE-330, CWE-693]
    capec: [CAPEC-20, CAPEC-97]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "createCipheriv(..., ..., '<literal>') or Buffer.from('<literal>') / Buffer.alloc(16) as the IV"
      - "a module-scope IV constant reused across calls"
      - "crypto-js with a literal `iv` option"
      - "createCipher (no IV parameter at all)"
    sanitizers:
      - "crypto.randomBytes(ivLength) computed per invocation and transmitted alongside the ciphertext"
      - "a monotonically increasing counter nonce with documented uniqueness (acceptable for GCM)"
    known_false_positives:
      - Decryption paths, where the IV legitimately comes from stored ciphertext
      - Deterministic encryption for a searchable-encryption blind index (a real, deliberate design)
      - Test vectors
    known_false_negatives:
      - IV read from config
      - IV generated once at module load and reused for every message — same weakness, different shape, worth catching
    prior_art:
      - "Semgrep javascript/node-crypto/security/create-de-cipher-no-iv.yaml (id: create-de-cipher-no-iv)"
      - "Semgrep javascript/node-crypto/security/gcm-no-tag-length.yaml (adjacent)"
      - "Semgrep javascript/node-crypto/security/aead-no-final.yaml (adjacent)"
      - "SonarJS S5542 — 'Encryption algorithms should be used with secure mode and padding scheme' (CWE-327, CWE-780)"
    references:
      - https://cwe.mitre.org/data/definitions/329.html
      - https://cwe.mitre.org/data/definitions/1204.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
      - https://nodejs.org/api/crypto.html
    notes: >
      Distinguishing encrypt from decrypt is essential — `createDecipheriv` with a stored IV is
      correct and would otherwise be the rule's biggest false positive. CWE-329 is the CBC-specific
      variant and CWE-1204 the general one, so both are listed with 1204 also appearing as 329's
      parent.

  - id: no-insecure-random
    family: cryptography
    title: Do not use Math.random() in a security-sensitive context
    description: >
