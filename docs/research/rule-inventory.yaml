    prior_art:
      - "eslint-plugin-react react/jsx-no-target-blank (verified in the locally installed eslint-plugin-react)"
      - "SonarJS S5148 — 'Opened windows should not have access to the originating page' (CWE-1022)"
    references:
      - https://cwe.mitre.org/data/definitions/1022.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    notes: >
      MITRE lists no CAPEC for CWE-1022, and it maps to no OWASP Top 10 2021 category, hence `none`
      in both fields. Impact is genuinely low now that browsers default `_blank` to noopener — the
      `window.open` case is the part that still matters. Already covered by
      `react/jsx-no-target-blank`, so our marginal value is small. Listed for completeness rather
      than recommended.

  - id: no-jquery-html-sink
    family: browser-dom
    title: Do not pass user data to jQuery APIs that parse HTML
    description: >
