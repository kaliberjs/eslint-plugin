      - Parser reached through a SOAP or feed-parsing dependency
    prior_art:
      - "CodeQL js/xxe"
      - "CodeQL js/xml-bomb"
      - "SonarJS S2755 — 'XML parsers should not be vulnerable to XXE attacks' (CWE-611, CWE-827)"
      - "Semgrep javascript/express/security/audit/express-libxml-noent.yaml"
      - "Semgrep javascript/node-expat/security/audit/expat-xxe.yaml"
