      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
      - https://nodejs.org/api/tls.html
      - https://codeql.github.com/codeql-query-help/javascript/js-disabling-certificate-validation/
    notes: >
      One of the best rules available to an ESLint plugin: a boolean literal in an options object,
      catastrophic impact, unambiguous intent, and a strong tendency to be added "temporarily" and
      never removed. Belongs in the first ten and is absent from the brief's proposed list — that
      is the main disagreement worth acting on.

  - id: no-node-tls-reject-unauthorized
    family: cryptography
    title: Never set NODE_TLS_REJECT_UNAUTHORIZED to 0
    description: >
      Setting this environment variable to `'0'` disables certificate verification for every TLS
      connection the process makes, including ones made by dependencies. Node itself emits a
      warning that this makes TLS connections insecure.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-295]
    cwe_parents: [CWE-287, CWE-284]
    capec: [CAPEC-459, CAPEC-475]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 5
      false_positive_risk: 1
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
      - "process.env['NODE_TLS_REJECT_UNAUTHORIZED'] = 0"
      - "Object.assign(process.env, { NODE_TLS_REJECT_UNAUTHORIZED: '0' })"
      - "the same assignment inside a dotenv default or a config module"
    sanitizers: []
    known_false_positives:
      - Test setup files and integration harnesses against a local self-signed server
      - One-off scripts that are never deployed
    known_false_negatives:
      - The variable set in a Dockerfile, CI config, shell profile or process manager, none of which ESLint sees
      - Value assigned from a variable rather than a literal
    prior_art:
      - "CodeQL js/disabling-certificate-validation (covers the environment-variable form)"
      - "SonarJS S4830 — 'Server certificates should be verified during SSL/TLS connections' (CWE-295)"
    references:
      - https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
      - https://cwe.mitre.org/data/definitions/295.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
    notes: >
      The single highest-confidence entry in the inventory: one exact assignment, process-wide
      blast radius, no legitimate production use. Should ship as an error with no autofix (deleting
      the line may break the developer's workflow; the correct fix is a CA, and that is a human
      decision). Note the honest limitation — most real instances of this live in shell and CI
      config, which a linter cannot see.

  - id: no-plain-http-url
    family: cryptography
    title: Do not make requests to hardcoded http:// endpoints
    description: >
      Cleartext HTTP exposes credentials, tokens and response bodies to any network observer and
      permits response tampering. The same applies to `ws://` and to package or script downloads
      over HTTP.
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-319]
    cwe_parents: [CWE-311, CWE-693]
    capec: [CAPEC-102, CAPEC-117, CAPEC-65]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 4
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "fetch / axios / got / undici / node-fetch with an `http://` literal"
      - "new WebSocket('ws://...')"
      - "http.get / http.request with a non-localhost host"
      - "script/img/iframe src built from an http:// literal"
      - "npm/yarn registry or install-script URLs over http"
    sanitizers:
      - "https:// / wss://"
      - "protocol-relative or environment-driven base URLs"
    known_false_positives:
      - "localhost, 127.0.0.1, ::1, *.local, and container hostnames — the dominant case by far"
      - XML namespace URIs and schema identifiers, which are identifiers and not fetched
      - Documentation links and comments
      - Well-known non-fetched URLs (`http://www.w3.org/2000/svg`)
    known_false_negatives:
      - URL assembled from a protocol variable
      - Base URL from configuration
      - Mixed content introduced by a dependency
    prior_art:
      - "CodeQL js/insecure-download"
      - "CodeQL js/insecure-dependency"
      - "SonarJS S5332 — 'Clear-text protocols should not be used' (CWE-200, CWE-319)"
      - "SonarJS S5730 — 'Content Security Policy should block mixed-content' (CWE-319, CWE-311, CWE-693)"
      - "Semgrep javascript/lang/security/detect-insecure-websocket.yaml (id: detect-insecure-websocket)"
      - "Semgrep typescript/react/security/react-insecure-request.yaml (id: react-insecure-request)"
    references:
      - https://cwe.mitre.org/data/definitions/319.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    notes: >
      Cheap and mostly right, but the localhost and namespace-URI exceptions are mandatory, not
      optional — without them this rule is unusable. The `http://www.w3.org/2000/svg` false
      positive alone will fire in every SVG-containing component. Ship with a built-in exemption
      list plus a configurable one.

  # =============================================================================================
  # FAMILY: ssrf-networking
  # =============================================================================================

  - id: no-ssrf
    family: ssrf-networking
    title: Do not make outbound requests to user-controlled URLs
    description: >
      If a request URL, host or path is attacker-influenced, the server becomes a proxy into its
      own network: cloud metadata endpoints, internal admin services, localhost-bound admin
      ports, and `file://`/`gopher://` scheme abuse.
    owasp_top10_2021: A10:2021-Server Side Request Forgery (SSRF)
    owasp_api_top10_2023: API7:2023 - Server Side Request Forgery
    cwe: [CWE-918]
    cwe_parents: [CWE-441, CWE-610, CWE-664]
    capec: [CAPEC-664]
    detectability: REQUIRES_INTERPROCEDURAL_ANALYSIS
    scores:
      security_impact: 5
      static_detectability: 3
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.query.url / req.body.url / req.params
      - "webhook and callback URLs supplied at registration time"
      - "Host / X-Forwarded-Host headers"
      - "SVG/image/PDF conversion inputs referencing remote resources"
    sinks:
      - "fetch(url) / axios(url) / axios.get / got / undici.request / node-fetch"
      - "http.get / http.request / https.request with a tainted host or path"
      - "puppeteer page.goto, playwright page.goto"
      - "image and document processors that accept a URL"
      - "proxy middleware targets (http-proxy-middleware `target`)"
    sanitizers:
      - "an allowlist membership test on the parsed hostname (not on the raw string)"
      - "resolving the hostname and rejecting private/link-local ranges"
      - "constructing the URL with a fixed base and only a path segment from input, path-escaped"
    known_false_positives:
      - Deliberate URL-fetching features — link preview, webhook delivery, feed readers, image proxies — where SSRF defence exists but is not recognisable to the analysis
      - URLs from an internal service registry that merely look dynamic
      - Server-side rendering fetching its own API by an env-configured base URL
      - Test code hitting a dynamic local port
    known_false_negatives:
      - "Source and sink in different modules, which is the normal architecture (this is the rule's defining limitation)"
      - "Partial control: fixed host, tainted path, enabling internal-endpoint access"
      - "Allowlist checks that are string-prefix based and bypassable (`startsWith('https://api.example.com')` matched by `https://api.example.com.evil.tld`)"
      - Redirect-based SSRF (see no-redirect-following-ssrf)
      - DNS rebinding, which no static analysis can see
    prior_art:
      - "CodeQL js/request-forgery"
      - "CodeQL js/client-side-request-forgery"
      - "CodeQL js/incomplete-url-substring-sanitization"
      - "CodeQL js/incomplete-hostname-regexp"
      - "Semgrep javascript/express/security/audit/express-ssrf.yaml (id: express-ssrf)"
      - "Semgrep javascript/apollo/security/apollo-axios-ssrf.yaml"
      - "Semgrep javascript/express/security/require-request.yaml"
      - "SonarJS S5144 — UNVERIFIED (closed-source Sonar security engine)"
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
      - https://owasp.org/API-Security/editions/2023/en/0xa7-server-side-request-forgery/
      - https://codeql.github.com/codeql-query-help/javascript/js-request-forgery/
      - https://github.com/advisories/GHSA-p8p7-x288-28g6
    notes: >
      A disagreement with the brief: SSRF is a top-tier vulnerability and a poor first ESLint
      rule. Source and sink are almost never co-located, and the applications that legitimately
      fetch user-supplied URLs are exactly the ones that will see the most alerts. The
      *sub-patterns* are worth shipping instead — no-dangerous-url-construction (prefix-based
      allowlist bypass, which CodeQL treats as its own queries) and
      no-redirect-following-ssrf — because those are wrong regardless of whether taint reaches
      them. GHSA-p8p7-x288-28g6 (request, CVE-2023-28155) is a real ecosystem instance.

  - id: no-redirect-following-ssrf
    family: ssrf-networking
    title: Do not follow redirects when fetching a semi-trusted URL
    description: >
      An allowlisted host can redirect to an internal one. If the client follows redirects, the
      allowlist check protected only the first hop — this is the standard bypass for SSRF
      defences.
    owasp_top10_2021: A10:2021-Server Side Request Forgery (SSRF)
    owasp_api_top10_2023: API7:2023 - Server Side Request Forgery
    cwe: [CWE-918]
    cwe_parents: [CWE-441, CWE-610, CWE-664]
    capec: [CAPEC-664]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - a URL that passed a hostname allowlist check earlier in the same function
    sinks:
      - "fetch(url) with default redirect: 'follow'"
      - "axios with maxRedirects unset (defaults to 5)"
      - "got with followRedirect unset"
      - "the `follow-redirects` package wrapping http/https"
    sanitizers:
      - "fetch(url, { redirect: 'manual' }) or 'error', with re-validation of the Location header"
      - "axios { maxRedirects: 0 }"
      - "a request library configured with a per-hop hostname check"
    known_false_positives:
      - Fetching fully trusted internal URLs where redirects are expected
      - Public-web crawling features where following redirects is the requirement
    known_false_negatives:
      - Redirect following inside a dependency
      - The allowlist check itself being in another module
    prior_art:
      - "CodeQL js/request-forgery"
      - "CodeQL js/incomplete-url-scheme-check (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/918.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://github.com/advisories/GHSA-jchw-25xp-jwwc
    notes: >
      Only meaningful when paired with a recognisable allowlist check — "validated then followed"
      is the signal. Without that pairing it degenerates into "you used fetch", which is useless.
      GHSA-jchw-25xp-jwwc (follow-redirects, CVE-2023-26159) shows the library-level version of the
      same problem.

  - id: no-dangerous-url-construction
    family: ssrf-networking
    title: Do not validate URLs with string operations, and do not concatenate into the authority
    description: >
      `url.startsWith('https://api.example.com')` is matched by
      `https://api.example.com.evil.tld`; `includes('example.com')` is matched by
      `https://evil.tld/?x=example.com`; an unanchored hostname regex matches anywhere.
      Concatenating input right after `https://` puts the attacker in the authority component.
    owasp_top10_2021: A10:2021-Server Side Request Forgery (SSRF)
    owasp_api_top10_2023: API7:2023 - Server Side Request Forgery
    cwe: [CWE-20]
    cwe_parents: [CWE-707]
    capec: []
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "url.startsWith('http...') / .includes('<domain>') / .indexOf('<domain>') used as a security check"
      - "an unanchored regular expression containing a dotted hostname"
      - "template literals of the form `https://${x}/...` or `${base}${x}` where x lands in the authority"
      - "new URL(userInput) without inspecting .protocol and .hostname afterwards"
    sanitizers:
      - "new URL(input) followed by an exact equality or suffix-with-dot check on .hostname, plus a .protocol allowlist"
      - "an anchored regex with escaped dots"
    known_false_positives:
      - Non-security URL string checks — routing, analytics classification, log grouping
      - Prefix checks on a path rather than a full URL
      - Feature detection on a known-constant URL
    known_false_negatives:
      - Check performed in a helper the rule cannot follow
      - Hostname comparison that is exact but case-sensitive, or that misses IDN/punycode equivalence
    prior_art:
      - "CodeQL js/incomplete-url-substring-sanitization"
      - "CodeQL js/incomplete-hostname-regexp"
      - "CodeQL js/incomplete-url-scheme-check"
      - "CodeQL js/incorrect-suffix-check"
      - "Semgrep typescript/lang/security/audit/cors-regex-wildcard.yaml (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/20.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-incomplete-url-substring-sanitization/
    notes: >
      The best of the SSRF-adjacent rules for an ESLint plugin, because the defect is *in the
      check itself* — purely syntactic, no taint required, and wrong regardless of where the input
      came from. CodeQL splits this into four separate queries, which is a good sign that the
      pattern family is real and tractable. MITRE lists no CAPEC for CWE-20. Strong candidate to
      ship in place of a general no-ssrf rule.

  - id: no-permissive-cors
    family: ssrf-networking
    title: Do not reflect the request Origin or use a wildcard CORS origin with credentials
    description: >
      `Access-Control-Allow-Origin: *` with `Allow-Credentials: true` is rejected by browsers, but
      *reflecting* the request's `Origin` header achieves the same thing and is not: any site can
      then read authenticated responses.
    owasp_top10_2021: A05:2021-Security Misconfiguration
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-942]
    cwe_parents: [CWE-863, CWE-923, CWE-285, CWE-284]
    capec: []
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 4
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "cors({ origin: true, credentials: true })"
      - "cors({ origin: (o, cb) => cb(null, true) })"
      - "res.setHeader('Access-Control-Allow-Origin', req.headers.origin)"
      - "res.setHeader('Access-Control-Allow-Origin', '*') together with Allow-Credentials"
      - "an origin allowlist regex that is unanchored or contains an unescaped dot"
      - "@nestjs/common enableCors with a permissive origin"
    sanitizers:
      - "an explicit literal array of allowed origins, compared by equality"
    known_false_positives:
      - Genuinely public, unauthenticated APIs where `*` is correct
      - Development servers
      - Preflight handling for a public CDN endpoint
    known_false_negatives:
      - Origin allowlist loaded from configuration
      - CORS applied by a reverse proxy or CDN
      - Callback allowlist implemented in another module
    prior_art:
      - "CodeQL js/cors-misconfiguration-for-credentials"
      - "CodeQL js/cors-permissive-configuration"
      - "SonarJS S5122 — 'Cross-Origin Resource Sharing (CORS) policy should be restricted to trusted origins' (CWE-346, CWE-942)"
      - "Semgrep javascript/express/security/cors-misconfiguration.yaml (id: cors-misconfiguration)"
      - "Semgrep typescript/lang/security/audit/cors-regex-wildcard.yaml"
      - "Semgrep typescript/nestjs/security/audit/nestjs-header-cors-any.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/942.html
      - https://cwe.mitre.org/data/definitions/346.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    notes: >
      MITRE lists no CAPEC for CWE-942 (CWE-346, its sibling reference, has many but they are
      channel-level attacks, not this). The high-value case is specifically origin-reflection with
      credentials; a bare `origin: '*'` on a public API should be at most info-level or the rule
      will fire on every public endpoint.

  - id: no-insecure-websocket
    family: ssrf-networking
    title: Do not open ws:// connections and do not skip WebSocket origin checks
    description: >
      `ws://` is unencrypted, and a WebSocket server that does not verify the `Origin` header
      accepts cross-site connections with the user's cookies (cross-site WebSocket hijacking).
    owasp_top10_2021: A02:2021-Cryptographic Failures
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-319, CWE-346]
    cwe_parents: [CWE-311, CWE-345, CWE-284, CWE-693]
    capec: [CAPEC-102, CAPEC-117]
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 3
      false_positive_risk: 3
      implementation_cost: 1
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "new WebSocket('ws://...')"
      - "socket.io client with a ws:// URL"
      - "ws.Server created without a verifyClient / origin check"
    sanitizers:
      - "wss:// and an explicit origin allowlist in verifyClient"
    known_false_positives:
      - localhost development servers and HMR sockets
      - Internal service-to-service sockets on a trusted network
    known_false_negatives:
      - URL from configuration
      - Origin verified in middleware ahead of the upgrade
    prior_art:
      - "Semgrep javascript/lang/security/detect-insecure-websocket.yaml (id: detect-insecure-websocket)"
      - "SonarJS S5332 — 'Clear-text protocols should not be used' (CWE-200, CWE-319)"
      - "CodeQL js/missing-origin-check (for the origin half, via postMessage semantics)"
    references:
      - https://cwe.mitre.org/data/definitions/319.html
      - https://cwe.mitre.org/data/definitions/346.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
      - https://github.com/advisories/GHSA-3h5v-q93c-6h6q
    notes: >
      Two weaknesses share one rule because they share one API surface. The localhost exemption is
      mandatory — every Vite/webpack dev setup opens a `ws://localhost` socket. Overlaps
      no-plain-http-url; consider merging the transport half there and keeping only the
      origin-check half here.

  # =============================================================================================
  # FAMILY: filesystem
  # =============================================================================================

  - id: no-path-traversal
    family: filesystem
    title: Do not build filesystem paths from user input without containment
    description: >
      `path.join(root, req.params.name)` escapes `root` as soon as the input contains `..`.
      `path.resolve` with an absolute-path input discards the root entirely. The containment check
      must be on the *resolved* path.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-22]
    cwe_parents: [CWE-706, CWE-664]
    capec: [CAPEC-126, CAPEC-76, CAPEC-64, CAPEC-78, CAPEC-79]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 3
      confidence: 3
      false_positive_risk: 4
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.params / req.query / req.body path or filename fields
      - "multipart upload `originalname`"
      - "archive entry names (see no-zip-slip)"
      - "`process.argv` in CLI tools"
    sinks:
      - "path.join / path.resolve / path.normalize with a tainted segment feeding an fs call"
      - "fs.readFile / writeFile / createReadStream / unlink / rm / readdir / stat"
      - "res.sendFile / res.download with a tainted path"
      - "express.static root computed from input"
      - "template/view name resolution"
    sanitizers:
      - "path.basename() applied to the untrusted segment"
      - "resolve-then-check: `resolved.startsWith(root + path.sep)` after path.resolve"
      - "membership test against a literal filename allowlist"
      - "res.sendFile with a `root` option, which Express containment-checks"
    known_false_positives:
      - Build tools, bundlers, codemods and CLIs where paths are developer-supplied by design
      - Paths derived from a database-stored, already-validated key
      - Values that were basename-ed in a helper the analysis cannot see
      - Tests constructing fixture paths
    known_false_negatives:
      - Path assembled across modules (the common architecture)
      - "Absolute-path injection: `path.join` is safe against `..` after a `basename`, but `path.resolve` still honours a leading `/`"
      - Traversal via encoded or unicode-normalised separators
      - Symlinks pointing outside the root, which is not visible statically
      - "Prefix-check containment bugs: `startsWith(root)` matches `/srv/app-evil` when root is `/srv/app`"
    prior_art:
      - "CodeQL js/path-injection"
      - "CodeQL js/exposure-of-private-files"
      - "eslint-plugin-security detect-non-literal-fs-filename"
      - "Semgrep javascript/lang/security/audit/path-traversal/path-join-resolve-traversal.yaml (id: path-join-resolve-traversal)"
      - "Semgrep javascript/express/security/audit/express-path-join-resolve-traversal.yaml (id: express-path-join-resolve-traversal)"
      - "Semgrep javascript/express/security/audit/express-res-sendfile.yaml (id: express-res-sendfile)"
      - "SonarJS S2083 — UNVERIFIED (closed-source Sonar security engine)"
    references:
      - https://cwe.mitre.org/data/definitions/22.html
      - https://owasp.org/www-community/attacks/Path_Traversal
      - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
      - https://codeql.github.com/codeql-query-help/javascript/js-path-injection/
      - https://github.com/advisories/GHSA-3jfq-g458-7qm9
    notes: >
      There is no OWASP cheat sheet for path traversal specifically (checked; Input Validation is
      the closest primary source, and the www-community attack page is the canonical description).
      `detect-non-literal-fs-filename` is notorious for noise in tooling repositories, so the
      shippable form is taint-gated, with a config option to exempt build/CLI directories. The
      most valuable sub-check is the containment-check-correctness one: flag
      `resolved.startsWith(root)` without a trailing separator.

  - id: no-arbitrary-file-read
    family: filesystem
    title: Do not read and return files named by the client
    description: >
      A read whose path is client-controlled discloses application source, `.env` files, SSH keys
      and `/etc/passwd`. This is path traversal specialised to the read-and-respond shape, which
      is where the impact is concentrated.
    owasp_top10_2021: A01:2021-Broken Access Control
