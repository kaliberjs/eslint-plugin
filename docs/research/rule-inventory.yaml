      - https://capec.mitre.org/data/definitions/178.html
      - https://github.com/advisories/GHSA-rv95-896h-c2vc
    notes: >
      A disagreement with the brief's first ten: impact is phishing-grade rather than
      RCE-grade, and it needs taint. The higher-value sibling is the *validation-correctness*
      check inside no-dangerous-url-construction — `startsWith('/')` accepting `//evil.tld` is a
      purely syntactic bug and is the actual cause of most real open redirects.
      GHSA-rv95-896h-c2vc (express, CVE-2024-29041) is a framework-level instance.

  - id: no-client-side-open-redirect
    family: redirects
    title: Do not assign a URL from location or a query parameter to location
    description: >
      Client-side open redirect: `location.href = new URLSearchParams(location.search).get('next')`.
      Same weakness as the server-side form, entirely within one file, and therefore much more
      tractable for a linter.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-601]
    cwe_parents: [CWE-610, CWE-664]
    capec: [CAPEC-178]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: true
    sources:
      - location.search / location.hash parsed for a redirect target
      - "postMessage event.data"
      - a storage value written earlier from a query parameter
    sinks:
      - "location.href / location.assign / location.replace"
      - "window.open(x)"
      - "router.push(x) / router.replace(x) with an absolute URL"
      - "form.action assignment"
    sanitizers:
      - "rejecting values containing a scheme or starting with `//`"
      - "new URL(x, location.origin) plus an origin equality check"
      - "a literal allowlist of internal paths"
    known_false_positives:
      - Hash-based routing assigning a validated route
      - Reloading the current URL with modified parameters
      - Locale switchers rebuilding the current path
    known_false_negatives:
      - Target read in one module, assigned in another
      - Protocol-relative and backslash bypasses of a naive relative-path check
      - Redirect via a framework router that normalises differently than the check assumed
    prior_art:
      - "CodeQL js/client-side-unvalidated-url-redirection"
      - "Semgrep javascript/browser/security/open-redirect.yaml (id: js-open-redirect)"
      - "Semgrep javascript/browser/security/open-redirect-from-function.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/601.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
    notes: >
      Better fit for this plugin than the server-side variant because source and sink are usually
      in the same component. Also catches the `javascript:` case when the sink is `location.href`,
      which overlaps no-javascript-url — worth sharing the protocol-allowlist sanitizer between
      the two.

  # =============================================================================================
  # FAMILY: access-control
  #
  # Read the honesty note in the header before using anything in this family. Access control is
  # the highest-impact OWASP category and the one static analysis of a single JavaScript file is
  # least able to reason about. Nothing here is recommended for the first wave. Two entries
  # (no-client-side-only-authorization, no-user-controlled-authorization-bypass) are worth
  # building because they detect a structurally wrong *shape*; the rest are documented so that
  # "we deliberately do not do this" is on the record rather than an omission.
  # =============================================================================================

  - id: no-idor-shaped-query
    family: access-control
    title: Do not look up a record by a client-supplied id without an ownership predicate
    description: >
      `Order.findById(req.params.id)` returns any order to any authenticated caller. The
      IDOR-shaped pattern is a lookup keyed only on a client-supplied identifier, with no
      tenant/owner constraint anywhere in the query.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: API1:2023 - Broken Object Level Authorization
    cwe: [CWE-639]
    cwe_parents: [CWE-863, CWE-285, CWE-284]
    capec: []
    detectability: REQUIRES_RUNTIME_INFORMATION
    scores:
      security_impact: 5
      static_detectability: 2
      ecosystem_prevalence: 4
      confidence: 2
      false_positive_risk: 5
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: true
    sources:
      - req.params.id / req.query.id / req.body.id
      - a path segment or GraphQL node id
    sinks:
      - "Model.findById(req.params.id) / findByPk / findUnique({ where: { id } })"
      - "a SQL WHERE clause keyed only on the supplied id"
      - "res.json of the fetched entity"
    sanitizers:
      - "an ownership predicate in the same query: `{ id, userId: req.user.id }` or `WHERE id = $1 AND tenant_id = $2`"
      - "a `can(user, 'read', entity)` policy check between fetch and response"
      - "row-level security in the database"
    known_false_positives:
      - "The overwhelming majority of matches: public resources, admin endpoints, entities that are not user-scoped, lookups already behind middleware authorization, multi-tenant isolation enforced by a connection-scoped schema or RLS policy"
      - Internal service endpoints
      - Reference-data lookups
    known_false_negatives:
      - Authorization present but incorrect (checks the wrong tenant, wrong role, or a stale claim)
      - Ownership enforced in a service layer the rule cannot see
      - Indirect IDOR through a nested include or a join
      - "Enumeration risk from sequential ids, which is a design issue, not a code pattern"
    prior_art:
      - "CodeQL: no JavaScript IDOR/BOLA query exists on the published query list"
      - "SonarJS: no verified open-source IDOR rule for JavaScript"
      - "Semgrep: no ecosystem-wide JS IDOR rule found in semgrep-rules; Semgrep's guidance for this class is project-specific custom rules"
    references:
      - https://cwe.mitre.org/data/definitions/639.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    notes: >
      Do not ship this as a general rule. MITRE lists no CAPEC for CWE-639, and — more tellingly —
      neither CodeQL nor the open-source Semgrep ruleset ships a generic JS IDOR query, because the
      pattern is indistinguishable from correct code without knowing the authorization model. The
      only defensible version is *project-configured*: the consuming project declares which models
      are tenant-scoped and which field carries the tenant, and the rule enforces that declaration.
      That is a genuinely useful rule and a completely different product from "detect IDOR".

  - id: no-missing-authorization-middleware
    family: access-control
    title: Do not register a mutating route without an authorization middleware
    description: >
      A route handler registered without any recognised auth middleware in its chain, on a method
      that mutates state, is a candidate missing-authorization defect.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: API5:2023 - Broken Function Level Authorization
    cwe: [CWE-862]
    cwe_parents: [CWE-285, CWE-284]
    capec: []
    detectability: REQUIRES_RUNTIME_INFORMATION
    scores:
      security_impact: 5
      static_detectability: 2
      ecosystem_prevalence: 3
      confidence: 1
      false_positive_risk: 5
      implementation_cost: 4
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "router.post / put / patch / delete with no middleware between the path and the handler"
      - "Next.js route handlers with no auth call in the body"
      - "tRPC procedures using publicProcedure for a mutation"
      - "GraphQL resolvers with no authorization directive or guard"
    sanitizers:
      - "a middleware or guard from a project-declared list of authorization helpers"
      - "an explicit in-handler check against req.user / session"
    known_false_positives:
      - "Auth applied globally with `app.use` before the router, in another file"
      - Auth enforced by an API gateway, service mesh, or reverse proxy
      - Intentionally public endpoints (login, register, webhooks, health checks, public search)
      - Auth applied by a framework convention (route grouping, file-system-based middleware)
      - Auth in a shared router factory
    known_false_negatives:
      - Middleware present but authorizing the wrong thing (authentication mistaken for authorization)
      - Role check that is trivially bypassable
      - Handler reachable through a second, unprotected route
    prior_art:
      - "CodeQL js/missing-rate-limiting (the closest analogue — rate limiting, not authorization)"
      - "CodeQL js/missing-token-validation (CSRF middleware presence)"
      - "CodeQL js/case-sensitive-middleware-path (adjacent: middleware that fails to match)"
      - "CodeQL: no generic missing-authorization query for JavaScript"
    references:
      - https://cwe.mitre.org/data/definitions/862.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/
    notes: >
      Confidence 1 is not pessimism, it is the correct value: a clean result means nothing and a
      finding is usually wrong, because the middleware is legitimately somewhere else. That CodeQL
      ships `js/missing-rate-limiting` but *not* a missing-authorization query — despite having
      whole-program analysis, which we do not — is the clearest available evidence that this is not
      tractable. If we build anything here it should be a project-declared allowlist ("these
      middleware names count as authorization; every mutating route must have one"), which is
      configuration enforcement rather than vulnerability detection. Recommend: do not ship.

  - id: no-client-side-only-authorization
    family: access-control
    title: Do not treat a client-side role check as an authorization decision
    description: >
      `if (user.role === 'admin')` in browser code hides UI; it does not protect data. When the
      same condition guards a fetch that returns privileged data, the server is the only real
      control and the client check is decoration.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: API5:2023 - Broken Function Level Authorization
    cwe: [CWE-602]
    cwe_parents: [CWE-693]
    capec: [CAPEC-162, CAPEC-207, CAPEC-21]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 3
      ecosystem_prevalence: 4
      confidence: 2
      false_positive_risk: 4
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "a role/permission comparison in a file under a client-only directory"
      - "a role check read from localStorage or a decoded-but-unverified JWT (overlaps no-jwt-decode-without-verify)"
      - "feature gating on a client-computed `isAdmin` that also gates a privileged fetch"
      - "hidden form fields or disabled inputs used as the only constraint on a value"
    sanitizers:
      - "a server-side check on the corresponding endpoint (not verifiable from client code — this is the rule's limit)"
      - "role information from a verified session on the server"
    known_false_positives:
      - "Correct UI gating, which is the intended use and by far the common case"
      - Progressive-disclosure and feature-flag UI
      - Optimistic rendering ahead of a server check
    known_false_negatives:
      - Server-side check absent, which the client file cannot reveal
      - Authorization by obscurity (an unlinked admin route)
      - Client check on a value that the server then trusts
    prior_art:
      - "CodeQL js/user-controlled-bypass"
      - "CodeQL js/type-confusion-through-parameter-tampering (adjacent)"
    references:
      - https://cwe.mitre.org/data/definitions/602.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Access_Control_Cheat_Sheet.html
    notes: >
      Worth building, but only in the narrow form: flag a role check whose *result is used as the
      only guard on a privileged network call*, in a file the config marks as client-only. Framed
      as "this hides UI, it does not authorize" it is educational rather than accusatory, which
      matters for adoption. Best of the access-control family for us, and still only a warn.

  - id: no-user-controlled-authorization-bypass
    family: access-control
    title: Do not let request data decide the outcome of a security check
    description: >
      A conditional that grants access based on a value the client supplies — `if (req.body.isAdmin)`,
      `if (req.query.debug)`, `if (req.headers['x-internal'])` — is an authorization bypass by
      construction, whatever the surrounding policy is.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: API5:2023 - Broken Function Level Authorization
    cwe: [CWE-807]
    cwe_parents: [CWE-693, CWE-20, CWE-707]
    capec: [CAPEC-21, CAPEC-162]
    detectability: PARTIALLY_DETECTABLE
    scores:
      security_impact: 5
      static_detectability: 4
      ecosystem_prevalence: 2
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: true
    sources:
      - "req.body.isAdmin / role / permissions / userId"
      - "req.query.debug / admin / bypass / preview"
      - "client-settable headers: x-user-id, x-internal, x-forwarded-for, x-admin"
      - a decoded-but-unverified JWT claim
    sinks:
      - "an if/ternary/logical guard whose condition reads a request-derived value and whose branch performs a privileged action or skips a check"
      - "`const userId = req.body.userId || req.user.id` — client-preferred identity"
      - "trusting X-Forwarded-For for an IP allowlist"
    sanitizers:
      - "deriving identity and role from a verified session or a verified token only"
      - "a comparison against a server-side value rather than a client-supplied one"
    known_false_positives:
      - Feature-preview flags that gate nothing privileged
      - Debug flags in development-only code paths
      - A client-supplied id that is subsequently authorized against the session
      - Internal headers set by a trusted proxy that strips them at the edge (a real and legitimate architecture)
    known_false_negatives:
      - Guard split across modules
      - Bypass through a value that reaches the condition after transformation
      - Trust in a header the rule's list does not cover
    prior_art:
      - "CodeQL js/user-controlled-bypass"
      - "CodeQL js/host-header-forgery-in-email-generation (a specific instance of trusting a client header)"
      - "CodeQL js/type-confusion-through-parameter-tampering"
      - "Semgrep javascript/lang/security/audit/unsafe-formatstring.yaml (unrelated; listed only to note that no equivalent Semgrep bypass rule was found)"
    references:
      - https://cwe.mitre.org/data/definitions/807.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/
    notes: >
      CWE-807 (reliance on untrusted inputs in a security decision) is a distinct weakness from
      CWE-862/863 and is the one that is actually detectable: the defect is that a *request value*
      appears in a *security condition*, which is a dataflow question inside one handler, not a
      policy question. The `req.body.userId || req.user.id` shape alone justifies the rule. This
      and no-client-side-only-authorization are the two access-control rules worth building.

  - id: no-missing-csrf-protection
    family: access-control
    title: Do not accept cookie-authenticated state-changing requests without CSRF defence
    description: >
      If the session travels in a cookie and the endpoint mutates state, a cross-site form or
      fetch can perform the action as the victim. SameSite cookies mitigate but do not replace a
      token for cross-site-capable flows.
    owasp_top10_2021: A01:2021-Broken Access Control
    owasp_api_top10_2023: none
    cwe: [CWE-352]
    cwe_parents: [CWE-345, CWE-693]
    capec: [CAPEC-62, CAPEC-111, CAPEC-467]
    detectability: REQUIRES_RUNTIME_INFORMATION
    scores:
      security_impact: 4
      static_detectability: 2
      ecosystem_prevalence: 3
      confidence: 2
      false_positive_risk: 4
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "a session-cookie app registering mutating routes with no csrf middleware"
      - "csurf registered after method-override, which can be bypassed"
      - "`csrf: false` / `csrfProtection: false` in a framework config"
      - "SameSite=None session cookies without a token"
    sanitizers:
      - "a CSRF token middleware, double-submit cookie, or Origin/Sec-Fetch-Site verification"
      - "SameSite=Strict/Lax plus bearer-token (non-cookie) authentication"
    known_false_positives:
      - "Token-authenticated APIs, where CSRF does not apply — the dominant case in modern JS"
      - CSRF handled by the framework by default (Next.js server actions, Rails-style meta tags)
      - Protection applied globally in another file
      - Webhook endpoints authenticated by signature
    known_false_negatives:
      - Middleware present but scoped to the wrong routes
      - Token generated but never compared
      - Login CSRF, which the presence of a token does not necessarily address
    prior_art:
      - "CodeQL js/missing-token-validation"
      - "SonarJS S4502 — 'CSRF protections should not be disabled' (CWE-352)"
      - "eslint-plugin-security detect-no-csrf-before-method-override"
      - "Semgrep javascript/lang/security/detect-no-csrf-before-method-override.yaml"
      - "Semgrep javascript/express/security/audit/express-check-csurf-middleware-usage.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/352.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
    notes: >
      "Is this app cookie-authenticated" is not answerable from one file, so the general rule is
      out. The two *specific* checks are worth having and both already exist as prior art: CSRF
      middleware explicitly disabled (`csrf: false`), and csurf registered after method-override.
      Ship those narrow forms; skip the general one.

  - id: no-disabled-security-framework-check
    family: access-control
    title: Do not disable framework or middleware security features
    description: >
      Helmet configured with protections switched off, `contentSecurityPolicy: false`, Angular SCE
      disabled, Electron `webSecurity: false` or `nodeIntegration: true`, debug endpoints enabled
      in production — each is a single literal that removes a layer.
    owasp_top10_2021: A05:2021-Security Misconfiguration
    owasp_api_top10_2023: API8:2023 - Security Misconfiguration
    cwe: [CWE-1188]
    cwe_parents: [CWE-1419, CWE-665, CWE-344, CWE-664]
    capec: []
    detectability: STATICALLY_DETECTABLE
    scores:
      security_impact: 3
      static_detectability: 5
      ecosystem_prevalence: 3
      confidence: 4
      false_positive_risk: 2
      implementation_cost: 2
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "helmet({ contentSecurityPolicy: false, hsts: false, frameguard: false })"
      - "Electron BrowserWindow webPreferences with webSecurity: false, nodeIntegration: true, contextIsolation: false, allowRunningInsecureContent: true"
      - "AngularJS $sceProvider.enabled(false)"
      - "graphql introspection/playground enabled in production, `debug: true` on an error handler"
      - "puppeteer/playwright launched with --disable-web-security"
    sanitizers:
      - "leaving the protection at its default, or configuring it correctly rather than disabling it"
    known_false_positives:
      - Development and test configuration
      - Electron apps that genuinely need node integration in a trusted local window
      - CSP disabled in the middleware because it is set at the CDN
    known_false_negatives:
      - Options built from configuration or environment
      - Protection disabled in a deployment manifest rather than in code
    prior_art:
      - "CodeQL js/insecure-helmet-configuration"
      - "CodeQL js/disabling-electron-websecurity"
      - "CodeQL js/enabling-electron-insecure-content"
      - "CodeQL js/angular-disabling-sce"
      - "SonarJS S4507 — 'Debugging features should not be enabled in production' (CWE-489, CWE-215)"
      - "SonarJS S5739 — 'HTTP Strict-Transport-Security policy should not be disabled' (CWE-319, CWE-693)"
      - "SonarJS S5730 — 'Content Security Policy should block mixed-content' (CWE-319, CWE-311, CWE-693)"
      - "SonarJS S5691 — 'Hidden files should not be served statically' (CWE-538)"
      - "Semgrep javascript/playwright/security/audit/playwright-exposed-chrome-devtools.yaml"
      - "Semgrep javascript/express/security/x-frame-options-misconfiguration.yaml"
    references:
      - https://cwe.mitre.org/data/definitions/1188.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
      - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
    notes: >
      MITRE lists no CAPEC for CWE-1188. Not strictly an access-control weakness — it is
      misconfiguration — but it is placed here because every instance removes an enforcement layer.
      Cheap, precise, and a good "grab bag" rule driven entirely by registry data, which means new
      sinks cost a data entry rather than a code change.

  - id: no-missing-rate-limiting
    family: access-control
    title: Apply rate limiting to authentication and expensive endpoints
    description: >
      Without throttling, a login endpoint is a credential-stuffing target and an expensive query
      is a denial-of-service target.
    owasp_top10_2021: A04:2021-Insecure Design
    owasp_api_top10_2023: API4:2023 - Unrestricted Resource Consumption
    cwe: [CWE-307, CWE-770]
    cwe_parents: [CWE-1390, CWE-287, CWE-799, CWE-400, CWE-665, CWE-284]
    capec: [CAPEC-49, CAPEC-16, CAPEC-560, CAPEC-112]
    detectability: REQUIRES_RUNTIME_INFORMATION
    scores:
      security_impact: 3
      static_detectability: 2
      ecosystem_prevalence: 3
      confidence: 2
      false_positive_risk: 4
      implementation_cost: 3
    priority_score: 0.0
    requires_taint: false
    sources: []
    sinks:
      - "a login/register/reset route with no rate-limiting middleware in its chain"
      - "an expensive query or file operation on an unauthenticated route"
      - "an unbounded loop or allocation driven by a request parameter"
    sanitizers:
      - "express-rate-limit, rate-limiter-flexible, or a framework equivalent on the route"
      - "an account-lockout or exponential-backoff mechanism"
    known_false_positives:
      - Rate limiting applied at the CDN, gateway, or load balancer, which is the normal production setup
      - Middleware applied globally elsewhere
      - Internal endpoints
    known_false_negatives:
      - Limiter present but with a useless threshold
      - Limiter keyed on a spoofable header
      - Limiting bypassed via a second route to the same handler
    prior_art:
      - "CodeQL js/missing-rate-limiting"
      - "CodeQL js/resource-exhaustion"
      - "CodeQL js/loop-bound-injection"
      - "SonarJS S5693 — 'HTTP request content length should be limited' (CWE-400, CWE-770)"
    references:
      - https://cwe.mitre.org/data/definitions/307.html
      - https://cwe.mitre.org/data/definitions/770.html
      - https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/
      - https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html
    notes: >
      Same structural problem as no-missing-authorization-middleware — the control is usually
      infrastructure, not code — with lower impact. CodeQL does ship this query, but with
      whole-program analysis and an explicit "expensive route" heuristic. Documented, not
      recommended. The tractable sub-case is the request-driven unbounded loop
      (CodeQL js/loop-bound-injection), which is a genuine intra-file pattern.
